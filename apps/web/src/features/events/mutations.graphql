mutation toggleFavorite($eventId: ID!) {
  toggleFavorite(eventId: $eventId) {
    eventId
    isFavorited
  }
}

mutation toggleCalendarAddition($eventId: ID!, $scheduleId: ID!) {
  toggleCalendarAddition(eventId: $eventId, scheduleId: $scheduleId) {
    eventId
    scheduleId
    isAddedToCalendar
  }
}

# Story 3.7c AC1: do not add sourceSocialMediaAccountProfile/profileImageUrl here — see queries.graphql.test.ts.
query getEvents($limit: Int, $offset: Int, $query: EventQueryConditionInput) {
  events(limit: $limit, offset: $offset, query: $query) {
    items {
      id
      eventName
      slug
      isFavorited
      favoriteCount
      imageUrl
      durableImageUrl
      location
      types
      categories
      schedules {
        id
        isMainSchedule
        eventStartDate
        eventStartTime
        eventEndDate
        eventEndTime
        ticketPrice
        locationDetails {
          coordinates {
            lat
            lng
          }
        }
      }
    }
    hasMore
    totalCount
  }
}

query getFavoritedEventIds($query: EventQueryConditionInput) {
  events(query: $query) {
    items {
      id
    }
    totalCount
  }
}

query getEventBySlug($slug: String!) {
  eventBySlug(slug: $slug) {
    id
    eventName
    slug
    description
    location
    types
    categories
    imageUrl
    durableImageUrl
    videoUrl
    instagramEmbed {
      status
      html
      durableImageUrl
    }
    sourcePostUrl
    originalPostUrl
    organizerName
    contactInfo
    hasPrivateContact
    isFavorited
    favoriteCount
    isHiddenForCurrentUser
    sourceSocialMediaAccountProfile {
      accountId
      platform
      username
      displayName
      profileImageUrl
      accountType
    }
    schedules {
      id
      isMainSchedule
      title
      eventStartDate
      isAddedToCalendar
      eventEndDate
      eventStartTime
      eventEndTime
      timezone
      timezoneStatus
      performers
      location
      locationDetails {
        coordinates {
          lat
          lng
        }
        placeName
        placeId
        formattedAddress
        timezone
        confidence
        matchType
      }
      ticketPrice
      ticketUrl
      registrationUrl
    }
  }
}

query getEventForIcsExport($id: ID!) {
  event(id: $id) {
    id
    eventName
    slug
    description
    location
    schedules {
      id
      eventStartDate
      eventEndDate
      eventStartTime
      eventEndTime
      timezone
      location
      locationDetails {
        formattedAddress
      }
    }
  }
}


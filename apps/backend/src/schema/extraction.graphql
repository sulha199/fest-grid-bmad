enum ExtractionErrorCode {
  NOT_FOUND
  UNSUPPORTED_PLATFORM
  NO_API_KEY
  SCRAPE_FAILED
  EXTRACTION_FAILED
  QUOTA_EXHAUSTED
  RATE_LIMITED # a rescrape of this post URL was done in the last 10 minutes (AD-40)
  ACCOUNT_NOT_SCRAPABLE # the post's account is personal or still awaiting classification (AD-34)
  SCRAPE_IN_PROGRESS # another request is fetching this post URL right now (FIND-110)
}

type ProposedScheduleCorrectionData {
  id: ID
  isMainSchedule: Boolean!
  eventStartDate: String!
  eventEndDate: String
  eventStartTime: String
  eventEndTime: String
  title: String
  performers: [String!]
  location: String
  ticketPrice: String
}

type ProposedEventCorrectionData {
  eventName: String!
  types: [EventType!]!
  categories: [EventCategory!]!
  location: String!
  organizerName: String
  contactInfo: String
  description: String
  schedules: [ProposedScheduleCorrectionData!]!
  links: [EventLink!]
}

# Story 4.2b -- the mutation no longer returns the extraction itself. After its synchronous
# pre-checks it returns `jobId` (poll `extractionJob`), or `errorCode`/`errorMessage` for a
# pre-check failure / failure to start. `data` is kept (always null) so the result shape stays a
# superset of Story 4.2a's.
type ExtractEventDataFromUrlResult {
  jobId: ID
  data: ProposedEventCorrectionData
  errorCode: ExtractionErrorCode
  errorMessage: String
}

enum ExtractionJobState {
  PENDING
  PROCESSING
  SUCCEEDED
  FAILED
}

type ExtractionJobStatus {
  status: ExtractionJobState!
  data: ProposedEventCorrectionData
  errorCode: ExtractionErrorCode
  errorMessage: String
}

"""
Where a post is in extraction (PRD 3.10). Derived from the post's state, never edited. Only PENDING posts
can be selected for extraction.
"""
enum PostExtractionStatus {
  PENDING
  QUEUED
  EXTRACTING
  PROMOTED
  NOT_EVENT
}

type Post {
  id: ID!
  accountId: ID!
  content: String
  imageUrl: String
  postUrl: String!
  originalPostUrl: String
  isExtracted: Boolean!
  extractionStatus: PostExtractionStatus!
  publishedAt: String!
}

type PostConnection {
  items: [Post!]!
  nextCursor: String
  hasMore: Boolean!
}

type ExtractionQuota {
  limit: Int!
  used: Int!
  remaining: Int!
}

# AD-40 -- the dry-run dedup outcome for one extracted event: what ingestion's real matching would do.
# NONE means no candidate event passed the candidate query.
enum ReextractionDedupTier {
  HIGH
  MID
  LOW
  NONE
}

type ReextractionPreviewDedup {
  tier: ReextractionDedupTier!
  score: Float
  candidateSlug: String
  candidateName: String
}

type ReextractionPreviewLink {
  url: String!
  label: String
}

type ReextractionPreviewSchedule {
  title: String
  startDate: String
  endDate: String
  isMain: Boolean!
}

type ReextractionPreviewEvent {
  extractionOrdinal: Int!
  eventName: String!
  # Ingestion would skip this item: the post's (post, ordinal) slot already holds this event.
  alreadyRepresentedBySlug: String
  # A roundup- or curator-sourced event is a stub (AD-30 Rule 10).
  isStub: Boolean!
  links: [ReextractionPreviewLink!]!
  schedules: [ReextractionPreviewSchedule!]!
  dedup: ReextractionPreviewDedup!
}

type PostReextractionPreview {
  groupingReason: PostGroupingReason
  # False for a URL that is not in our database: the dedup outcome then has no account signal.
  postStored: Boolean!
  rescraped: Boolean!
  # BUG-097 -- images the post lists (cover + slides) and images the extraction actually read. Fewer
  # read than listed means the moderator is looking at an incomplete preview.
  imagesAvailable: Int!
  imagesSent: Int!
  events: [ReextractionPreviewEvent!]!
}

type PostReextractionPreviewStatus {
  status: ExtractionJobState!
  preview: PostReextractionPreview
  errorCode: ExtractionErrorCode
  errorMessage: String
}

type StartPostReextractionPreviewResult {
  jobId: ID
  errorCode: ExtractionErrorCode
  errorMessage: String
}

extend type Query {
  postsByAccount(accountId: ID!, cursor: String, limit: Int, onlyUnextracted: Boolean, statuses: [PostExtractionStatus!]): PostConnection!
  myExtractionQuota: ExtractionQuota!
  extractionJob(id: ID!): ExtractionJobStatus!
  # AD-40 -- moderator only. Polls a re-extract preview started by previewPostReextraction.
  postReextractionPreview(id: ID!): PostReextractionPreviewStatus!
}

extend type Mutation {
  extractEventDataFromUrl(url: String!): ExtractEventDataFromUrlResult!
  selectPostsForExtraction(postIds: [ID!]!): [Post!]!
  # AD-40 -- moderator only, preview only (writes nothing to events/schedules/posts). Give exactly
  # one of postId or url. Rescrapes when the post's caption is not stored or its image links have expired.
  previewPostReextraction(postId: ID, url: String): StartPostReextractionPreviewResult!
}

type AIEventFilter {
  id: ID!
  ownerUserId: ID!
  prompt: String!
  resolvedFilter: EventFilter
  expression: FilterNode!
  createdAt: String!
  updatedAt: String!
  deletedAt: String
}

type ResolvedAIEventFilterResult {
  resolvedFilter: EventFilter!
  expression: FilterNode!
  caveats: [String!]!
}

extend type Query {
  myAIEventFilters: [AIEventFilter!]!
}

extend type Mutation {
  resolvePromptToEventFilter(prompt: String!): ResolvedAIEventFilterResult!
  saveAIEventFilter(prompt: String!, resolvedFilter: EventFilterInput, expression: FilterNodeInput): AIEventFilter!
  deleteAIEventFilter(id: ID!, action: SoftDeleteAction!): AIEventFilter!
}

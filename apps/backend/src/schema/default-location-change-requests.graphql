enum DefaultLocationChangeRequestStatus {
  AWAITING_APPROVAL # not yet applied -- a low-confidence AI inference awaiting a moderator decision (added 2026-08-28)
  PENDING_REVIEW
  ACCEPTED
  REJECTED # a moderator rejected an AWAITING_APPROVAL request -- never applied, distinct from REVERTED (added 2026-08-28)
  REVERTED
  SUPERSEDED
}

enum DefaultLocationChangeAction {
  ACCEPT
  REVERT
  APPROVE # for an AWAITING_APPROVAL request: applies newLocation (added 2026-08-28)
  REJECT  # for an AWAITING_APPROVAL request: discards without ever applying (added 2026-08-28)
}

enum DefaultLocationChangeSource {
  USER
  AI_INFERENCE
  MODERATOR
}

type DefaultLocationChangeRequest {
  id: ID!
  accountId: ID!
  account: SocialMediaAccountProfile!
  previousLocation: LocationDetails
  newLocation: LocationDetails!
  status: DefaultLocationChangeRequestStatus!
  changedByUserId: ID
  changeSource: DefaultLocationChangeSource!
  confidenceScore: Float
  createdAt: String!
  reviewedByModeratorId: ID
  reviewedAt: String
}

extend type Query {
  pendingDefaultLocationChanges: [DefaultLocationChangeRequest!]!
}

extend type Mutation {
  resolveDefaultLocationChange(id: ID!, action: DefaultLocationChangeAction!): DefaultLocationChangeRequest!
}

  # ── 2026-09-15 (bmad-agent-architect getEvents review) ──────────────────────
  BUG-030:
    {type: bug, status: triaged, created: 2026-09-15,
     impact: user-visible, effort: m,
     title: "getEvents N+1: schedules/favoriteCount/isFavorited resolved per-row instead of batched, on the highest-traffic query",
     ref: [_bmad-output/project-context.md, planning-artifacts/sprint-change-proposal-2026-09-15-getevents-eventbyslug-perf-hardening.md],
     touches: [app:backend, web:events/getEvents, pkg:graphql-select, cross:architecture],
     note: "Found via bmad-agent-architect review (2026-09-15) requested by user of getEvents and its Discovery/Feed/Favorites usage. buildOptimizedDrizzleSelect (packages/graphql-select/optimized-select.ts) only maps requested GraphQL fields to physical columns of the `events` Drizzle table, so it has no way to batch computed/virtual fields. The shared apps/web/src/features/events/queries.graphql `getEvents` document (used by Discovery, Feed, and Favorites' batched fetch) requests favoriteCount, isFavorited, and schedules{...} on every item; each falls through to its own per-parent Event.* field resolver in apps/backend/src/schema/resolvers.ts (schedules: line ~3619, isFavorited: ~3649, favoriteCount: ~3664), issuing one DB round trip per row per field — roughly 1+1+3N queries for a page of N events, up to `limit`'s max of 1000. The `events` resolver's own `fieldMap` (~2991-3018) already builds efficient EXISTS-subquery forms for isFavorited/isAddedToCalendar/isFromSubscribedAccount for WHERE-clause filtering — these are unused for output and should be reused (or a per-request DataLoader added) so the batch stays O(1) queries per page instead of O(N). Documented as a standing rule in _bmad-output/project-context.md's Database & Performance section and the PRD's NFR Performance section so future changes to this resolver don't add more per-row field resolvers."}

  FIND-027:
    {type: finding, status: triaged, created: 2026-09-15,
     impact: internal, effort: xs,
     title: "getEvents computes totalCount via a second full query on every call, not gated by GraphQL field selection",
     ref: [planning-artifacts/sprint-change-proposal-2026-09-15-getevents-eventbyslug-perf-hardening.md], touches: [app:backend, web:events/getEvents],
     note: "Found via bmad-agent-architect review (2026-09-15). apps/backend/src/schema/resolvers.ts's `events` resolver (~3163-3170) runs a second query (count() with two left joins) unconditionally, even when the client doesn't select `totalCount` — the code already has a `// Note:` comment acknowledging this. Not currently wasted (Discovery/Feed/Favorites all request totalCount today), but unlike the item-list select it isn't gated by `info` field selection, so it silently becomes dead work the moment any consumer drops the field. Fix: check `info` for `totalCount` selection the same way buildOptimizedDrizzleSelect already does for `items`."}

  FIND-028:
    {type: finding, status: triaged, created: 2026-09-15,
     impact: internal, effort: xs,
     title: "Discovery/Feed/Favorites getEvents queries have no staleTime, refetching the heaviest endpoint on every remount/refocus",
     ref: [planning-artifacts/sprint-change-proposal-2026-09-15-getevents-eventbyslug-perf-hardening.md], touches: [web:events/getEvents],
     note: "Found via bmad-agent-architect review (2026-09-15). The useInfiniteQuery/useQuery hooks in apps/web/src/app/[locale]/home-content.tsx, feed/feed-content.tsx, and favorites/favorites-content.tsx all omit `staleTime`, so React Query's default of 0 applies — every remount or window refocus on Discovery, Feed, or Favorites refires a request against getEvents, the highest-traffic endpoint in the app. A short staleTime (e.g. 30s) would cut request volume for normal tab-switching/navigation without materially staling the data."}

  BUG-031:
    {type: bug, status: done, created: 2026-09-15,
     impact: user-visible, effort: s,
     title: "Infinite scroll jumps to the very bottom after loading a page (mobile always, desktop sometimes)",
     ref: [],
     touches: [web:events, pkg:ui],
     note: "Reported by user via bmad-help (2026-09-15). DIAGNOSED & FIXED 2026-09-17 (bmad-quick-dev). Root cause confirmed: sentinel element's height collapses after page load because the spinner-containing content disappears, causing browser scroll-anchoring to jump. The sentinel displays tall (~48-60px) when isFetchingNextPage=true (spinner visible), then shrinks to ~28px when isFetchingNextPage=false (just py-4 padding), triggering scroll anchoring on appended items. Fix applied: (1) Added min-h-16 to EventListView.tsx's sentinel to maintain consistent height; (2) Added 'You've reached the end' indicator when !hasNextPage (visible UX feedback as user suggested); (3) Updated EventListViewProps interface to accept optional hasNextPage prop; (4) Updated all 5 consumers (Discovery/Feed/Favorites/Archive/Account) to pass hasNextPage from useInfiniteQuery. Changes: packages/ui/src/features/events/EventListView.tsx/.types.ts (min-height + end-of-list indicator), apps/web/src/app/[locale]/{home,feed,favorites,archive,[platformSlug]/[accountId]}/xxx-content.tsx (pass hasNextPage prop). Verified no breaking changes — hasNextPage is optional for backward compatibility; existing consumers without it render end-of-list text only when explicitly false."}


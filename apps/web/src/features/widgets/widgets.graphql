mutation createWidget($input: CreateWidgetInput!) {
  createWidget(input: $input) {
    id
    ownerUserId
    filters {
      accountId
      types
      categories
      keyword
      dateRange {
        anchor
        offsetAmount
        offsetUnit
      }
      dayOfWeek
      location {
        coordinates {
          lat
          lng
        }
        radiusMeters
        adminArea
      }
      venueType
      isFree
    }
    displayMode
    theme
    createdAt
  }
}

mutation updateWidget($id: ID!, $input: UpdateWidgetInput!) {
  updateWidget(id: $id, input: $input) {
    id
    ownerUserId
    filters {
      accountId
      types
      categories
      keyword
      dateRange {
        anchor
        offsetAmount
        offsetUnit
      }
      dayOfWeek
      location {
        coordinates {
          lat
          lng
        }
        radiusMeters
        adminArea
      }
      venueType
      isFree
    }
    displayMode
    theme
    createdAt
  }
}

mutation deleteWidget($id: ID!, $action: SoftDeleteAction!) {
  deleteWidget(id: $id, action: $action) {
    id
    deletedAt
  }
}


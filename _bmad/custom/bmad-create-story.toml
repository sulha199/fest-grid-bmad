[workflow]
persistent_facts = [
  "When creating a story, automatically identify if the story requires UI components that should be reusable. If so, explicitly mention in the story that the component should be created inside `packages/ui`.",
  "When creating a story, automatically identify if the story requires function/mechanism that should be reusable. If so, explicitly mention in the story that the function/mechanism should be created inside `packages/domain`.",
  "When creating a story, automatically identify if the story requires a cloud or external service to be setup. If so, explicitly mention in the story that it will include updating steps in SETUP_WALKTHROUGH.md",
  "When creating a story, automatically identify if the story requires tracking user interactions or adding user-analytics (AD-5). If so, explicitly list the exact event names and payload shapes required for PostHog analytics in the story body.",
  "When creating a story that requires localization/i18n (AD-6), explicitly list the exact locale keys (e.g. en, id) required for next-intl in the story body.",
  "Any story retrieving an event collection (AD-1/AD-2) must express its condition via the AD-1 Unified Query DSL against the single event query endpoint (AD-2) — never a new single-purpose endpoint.",
  "Any story requiring database schema changes (AD-3) must explicitly state that the changes must ship as Drizzle-kit generated SQL migration files checked into the repository.",
  "Gate 1 must verify that any story implementing subscription or extraction logic strictly follows the three-queue architecture (ScrapingQueue/AIProcessingQueue/DataIngestionQueue) and the Adapter-pattern AI Gateway, per docs/infrastructure/2-backend.md.",
  "When creating a story, automatically identify missing or incompatible data types across DB schema, API contracts, and TypeScript types/interfaces. If found, explicitly add required DB migration and TypeScript type-change actions in a dedicated section. If none are found, include the section with 'No changes required' rationale.",
  "When creating a story, automatically identify if the story requires state management. If so, explicitly categorize the state into Server State (React Query), URL State (nuqs), or Client Global State (zustand) based on the architectural guidelines, and mention this required categorization in the story.",
  "When creating a story, automatically identify if the story involves an asynchronous process. If so, explicitly categorize the required loader as Blocking (full-screen overlay for critical mutations/actions) or Non-Blocking (Skeleton screens for initial load/transitions, localized spinner for infinite scroll) based on the UI invariant rules, and mention this required categorization in the story.",
  "file:{project-root}/docs/infrastructure/index.md",
  "The full infrastructure architecture is sharded under docs/infrastructure/ (index above: high-level-overview, 1-frontend, 2-backend, 3-database, 4-push-notifications, note-for-the-future). If the story touches backend compute, the SQS queues (ScrapingQueue/AIProcessingQueue/DataIngestionQueue), EventBridge/cron, API Gateway, or database provisioning, read the relevant shard file(s) under docs/infrastructure/ before finalizing Dev Notes and the Gate 1 analysis. Frontend-only stories with no infra changes need only the index summary above. If a story documents new infra/deployment steps (e.g. CI/CD, Vercel setup), append them to the specific relevant shard file, not a recreated monolithic file.",
  "file:{project-root}/_bmad-output/planning-artifacts/story-content-structure.md",
  "Every newly created story must follow the canonical section order and status vocabulary from story-content-structure.md.",
  "Every newly created story must include a concise Global Rules References section pointing to project-context, story-content-structure, architecture spine, and infrastructure docs.",
  "Every newly created story must include a concrete Implementation Plan (Rule-Compliant) with File Change Plan, Rule Mapping, and Verification Plan.",
  "Every newly created story must include a Pre-Coding Approval Gate checklist with default pending approval state before implementation starts.",
  "file:{project-root}/_bmad-output/planning-artifacts/story-split-gate.md",
  "Treat story-split-gate.md as mandatory: before Step 5 writes the story file, run Gate 1 (Architecture/Infra Completeness, persona bmad-agent-architect/Winston), Gate 2 (UI Complexity & Reusability, persona wds-agent-freya-ux/Freya, fallback bmad-agent-ux-designer/Sally), and Gate 3 (Foundational/Cross-Cutting Dependency Completeness, persona bmad-agent-architect/Winston) via the runSubagent tool against the draft story scope.",
  "The project's authoritative UX specs live under {project-root}/design-artifacts/<UX-*-run-*>/DESIGN.md and EXPERIENCE.md (WDS module output) — always locate and load the relevant DESIGN.md/EXPERIENCE.md for the feature area in addition to any *ux*.md under planning_artifacts, since the latter is typically absent for this project.",
  "For Gate 3, cross-check the draft story scope against project-context.md's Technology Stack and Critical Implementation Rules (e.g. i18n/next-intl setup, global app shell/layout, analytics provider wiring, GraphQL Code Generator pipeline, named reusable utilities like buildOptimizedDrizzleSelect) and against epics.md. If a mandated dependency is referenced there but has no corresponding story anywhere in epics.md, and it would be needed by more than just the current story, that is a Gate 3 finding — do not build it as a byproduct of this story.",
  "If Gate 1, Gate 2, or Gate 3 finds a blocking gap (missing infra/architecture layer, a reusable/complex UI component/hook/util that deserves its own story, or a missing foundational/cross-cutting dependency), do not absorb it into the current story. Instead add an 'Architecture & UX Gate Findings' subsection under Dev Notes, list the deferred scope under Out of Scope with a suggested prerequisite story key, append a new backlog entry for it to sprint-status.yaml, and add a Pre-Coding Approval Gate checklist item confirming the prerequisite is done or the gap is explicitly accepted by the user.",
  "Always report gate findings and any new prerequisite story keys added to sprint-status.yaml in the final completion summary.",
  "Every new prerequisite story produced by a gate finding must get a full section written into epics.md (As a/I want/So that, Acceptance Criteria, and a Note explaining which gate and which story/epic surfaced it) — a sprint-status.yaml backlog key alone is not sufficient, since epics.md is the authoritative source bmad-create-story reads story requirements from. Apply the numbering rule from bmad-epic-readiness-check's SKILL.md: a tooling/infrastructure gap (adapter, IaC, a scaffold/foundation reusable by nature) becomes a new Epic 0 story appended after Epic 0's current highest number; a shared-data-ownership gap (a table this epic originates but others read) becomes a lettered suffix within the owning epic, before the first story that writes it, following the Story 1.1 precedent; a single-story architecture/UI split becomes a lettered suffix directly off that one story, matching the 1.3a/1.3b/1.6a pattern. Never renumber an existing story to make room — only append or insert a new letter.",
  "When creating a story, ensure strict package dependency rules are explicitly enforced: State management (react-query, nuqs, zustand) must be isolated strictly within apps/web. Testing frameworks (vitest, msw) should use a shared config package (@festgrid/testing-config), but playwright must stay in apps/web. Schema validation must be strictly isolated: zod only in apps/web (or specific UI packages) and ajv only in apps/backend. Firebase must be split: firebase-admin strictly in apps/backend and firebase JS SDK strictly in apps/web. Ensure no single shared package mixes these distinct domain tools."
]

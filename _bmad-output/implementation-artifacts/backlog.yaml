  # ── 2026-09-11 (bmad-help event-extraction-recurrence-bug session) ──────────
  BUG-026:
    {type: bug, status: backlog, created: 2026-09-11,
     impact: user-visible, effort: m,
     title: "Recurring single-day-of-week schedules extract as one contiguous date span, silently matching every weekday inside it (not just the stated day)",
     ref: [planning-artifacts/prds/festgrid-prd-2026-07-10-2047/prd.md], touches: [cross:ai-extraction, cross:prd, app:backend, pkg:domain, web:events],
     note: "Reported by user via bmad-help against a real scraped event (Pakuwon Mall Jogja 'SEPTEMBER FEAST', IG p/Dcx14Dak8zN). Caption states the promo is 'Valid only from Monday to Wednesday during September 2026' with explicit per-day date lists (Mon: 7/14/21/28, Tue: 8/15/22/29, Wed: 9/16/23/30). Extraction correctly produced 3 named schedules (Monday/Tuesday/Wednesday Special Feast) but each one's eventStartDate/eventEndDate collapsed its 4 discrete occurrences into one contiguous span (e.g. Monday: 2026-09-07..2026-09-28) — so per the `Schedule` interface (PRD Section 4.4, prior to this fix) and its DB/GraphQL representation (packages/database/schema.ts:341-342, a plain daterange pair with no other qualifier), that schedule read as valid every single day Sep 7-28 inclusive, Thu-Sun included, contradicting the caption's own terms.
     Root cause confirmed in both layers: (1) the extraction prompt (apps/backend/src/lib/ai-processor/build-gemini-request.ts:68) tells the model only to fill eventStartDate/eventEndDate per schedule, with zero guidance for a repeating single-weekday pattern — extracted-event.schema.ts:8-22 had no field to express one either; (2) this isn't cosmetic — it is already a live, shipped-feature correctness bug. The AI Event Filter's `dayOfWeek` matching (packages/domain/src/events/buildEventsQueryCondition.ts:73-83's getDays + :109-128) enumerates every real calendar date matching a requested weekday in the active window and checks `scheduleDateRange overlaps {d,d}` per date (packages/graphql-select/drizzle-where.ts:80-96's inclusive `daterange(startCol, COALESCE(endCol,startCol), '[]')`) — a pure contiguous-range overlap with no weekday awareness. So filtering for e.g. Friday events today already incorrectly returns this event's Monday-Special-Feast schedule (and any other multi-day-span schedule) for every Friday inside its span, not just actual Mondays. The gap predates this report and affects every existing multi-day schedule, not only ones extracted going forward.
     RESOLVED (schema decision only, 2026-09-11 via bmad-prd): PRD amended — `Schedule` (Section 4.4) gained `applicableDaysOfWeek?: DayOfWeek[]`, reusing the `DayOfWeek` enum already defined for `EventFilterInput.dayOfWeek` (Section 4.18/4.19), plus a new Section 3.7 extraction-behavior bullet and an updated Calendar View Behavior clause (Section 3.3-area) describing how a schedule's occurrences narrow to only the matching weekdays within its span. PRD status: final, updated 2026-09-11; decision record (array-vs-single-value, default/legacy-data behavior for schedules with the field unset, and scope explicitly deferred out of the PRD pass) is in that run's `.memlog.md`. Still open, deliberately deferred by the user rather than backfilled here: (1) the extraction prompt + `extracted-event.schema.ts`/`geminiExtractionResponseSchema` need to actually populate the new field; (2) `buildEventsQueryCondition.ts`'s `dayOfWeek` matching and `drizzle-where.ts`'s date-range overlap need the actual correctness fix so they respect `applicableDaysOfWeek` instead of the raw span; (3) `epics.md` has not been backfilled with this PRD change. Next step: `bmad-create-story` against this item — the schema question that blocked it is resolved, this is now a normal implementation story."}

  # ── 2026-09-11 (bmad-help instagram-embed-perf session) ─────────────────────
  IDEA-020:
    {type: idea, status: backlog, created: 2026-09-11,
     impact: user-visible, effort: l,
     title: "Instagram embed loads too slowly — generate embed markup client-side, cache Instagram's JS/CDN assets, and add a PWA install path to make that caching durable",
     ref: [], touches: [pkg:ui, app:backend, web:events, cross:process],
     note: "Requested by user via bmad-help, as a 3-part improvement. Verified current architecture first: apps/backend/src/lib/instagram-oembed/adapter.ts's resolveInstagramOEmbed() calls Meta's tokenless oEmbed endpoint server-side, cached 24h (cache-store.ts, INSTAGRAM_OEMBED_CACHE_TTL_MS), and returns the raw oEmbed `html` string over GraphQL; packages/ui/src/features/events/InstagramEmbed.tsx then dangerouslySetInnerHTML's that HTML client-side and separately injects Instagram's own `//www.instagram.com/embed.js` widget script (loadInstagramEmbedScript), which is what actually replaces the blockquote with a real iframe (watched via MutationObserver, 4s fallback timeout per EMBED_READY_FALLBACK_TIMEOUT_MS). The perceived slowness is most likely embed.js's own script-load-then-iframe-fetch chain against Instagram's CDN, not primarily the backend GraphQL round trip.
     (1) Frontend-generated embed code — RESEARCHED 2026-09-11 via bmad-help, conclusion: don't drop the backend call. Confirmed Instagram's manual-embed pattern (`blockquote.instagram-media` + `data-instgrm-permalink` + embed.js + `instgrm.Embeds.process()`) works without ever calling Meta's oEmbed API — this repo's own apps/web/e2e/event-details-instagram-csp.spec.ts:43 already builds exactly that shape for its CSP test, so it's proven to render here. BUT confirmed embed.js exposes no error/failure callback for a deleted/private post — it just silently fails to hydrate, which is exactly the gap InstagramEmbed.tsx's existing MutationObserver+4s-timeout heuristic already works around as a backup signal. Going fully client-side would make that heuristic the ONLY availability signal instead of a backup to a deterministic backend check, directly weakening the AVAILABLE/UNAVAILABLE branch that decides whether to show the embed, the `durableImageUrl` fallback, or the 'no longer available' placeholder (resolveInstagramEmbedResult.ts). Verdict: keep the backend oEmbed call for its deterministic status; the actual fix for perceived slowness is (2) below, not eliminating this call.
     (1b) Real root cause found instead, and split out to its own ready-to-implement item — see IDEA-022.
     (2) Caching embed.js + Instagram CDN images/reel video per 'Meta's best practice': whoever picks this up should default to standard patterns (stale-while-revalidate for embed.js itself, since it's a shared static script; cache-first with a bounded TTL for images/video, since Instagram CDN URLs are typically signed and expire — this codebase already has separate precedent for that exact problem via the durable-image re-hosting pipeline, see 3-6e/3-6f, which may be a more relevant model here than browser caching of an expiring URL).
     AMENDED (2026-09-11, same session): user supplied 3 citations (elfsight.com/blog/how-to-embed-instagram-feed-in-html, bluehost.com/blog/meta-oembed-read-explained, developers.facebook.com/documentation/instagram-platform/oembed.md) — not independently fetched/verified by this session, but cross-checked against this repo's actual code where a concrete claim was checkable. Two of the three claims describe things this codebase already does correctly, not gaps: (i) 'short-lived HTML caching, TTL of a few hours to a day' — adapter.ts's INSTAGRAM_OEMBED_CACHE_TTL_MS is already 24h, already compliant; (ii) 'load embed.js exactly once on the frontend to render all active embeds' — InstagramEmbed.tsx's loadInstagramEmbedScript already dedups via INSTAGRAM_EMBED_SCRIPT_SELECTOR before injecting a second copy, already compliant. The third claim IS a real, verified gap and is small/independent enough to spin out on its own — see IDEA-021. The 'Meta does not return thumbnail_url/author_name' claim is a documented oEmbed response-shape limitation, not something to fix here — only relevant if/when (1) above (frontend-generated markup) is attempted, since a hand-built blockquote can't source those fields from the endpoint either way.
     (3) Service worker + PWA install button + iOS UX: verified the repo already registers exactly one service worker today — apps/web/public/firebase-messaging-sw.js, registered by apps/web/src/lib/push-notifications.ts:66, scoped solely to Firebase Cloud Messaging push notifications, not general asset caching. No apps/web/public/manifest.json (web app manifest) exists, so the app is not installable as a PWA at all today — this is new scope, not an extension of existing infra. Adding a caching SW requires an architecture decision on whether to extend the existing FCM SW's scope or register a second one (browsers support either). iOS Safari has no `beforeinstallprompt` event and no native install-prompt UI, so the Android/Chrome install-button pattern doesn't transfer directly — the standard workaround is a custom in-app banner/instructions directing users to Share → Add to Home Screen, typically gated on `navigator.standalone`/the `display-mode: standalone` media query, and needs its own UX pass (bmad-ux) distinct from the beforeinstallprompt path.
     Also flag: apps/web/next.config.ts already carries a narrow CSP (`frame-src`/`child-src` allowlisting `https://www.instagram.com` only) specifically for the current embed.js/iframe pattern, guarded by e2e/event-details-instagram-csp.spec.ts — any change to how/where embed.js or its iframe loads from must keep that test green. Not yet scoped or estimated in detail; breadth (SW/PWA architecture decision, iOS install UX, CSP impact, possible removal of the backend oEmbed layer) suggests this needs bmad-architecture and/or bmad-ux before a story can be drafted."}

  IDEA-021:
    {type: idea, status: backlog, created: 2026-09-11, parent: IDEA-020,
     impact: internal, effort: xs,
     title: "Pass omitscript=true when calling Meta's oEmbed endpoint, since the frontend already loads embed.js itself",
     ref: [], touches: [app:backend],
     note: "Split out of IDEA-020 — a small, independently actionable win surfaced by a user-supplied citation (developers.facebook.com/documentation/instagram-platform/oembed.md, cited but not independently fetched by this session) and verified against this repo's actual code. adapter.ts's resolveInstagramOEmbed() builds its request as `${INSTAGRAM_OEMBED_ENDPOINT}?url=${encodeURIComponent(postUrl)}` (apps/backend/src/lib/instagram-oembed/adapter.ts:26) — no `omitscript` param today, so Meta's response `html` includes its own inline `<script>` tag alongside the blockquote. That's redundant: InstagramEmbed.tsx (packages/ui/src/features/events/InstagramEmbed.tsx) already loads `//www.instagram.com/embed.js` itself once per page via loadInstagramEmbedScript, independent of whatever the cached HTML contains. Fix: add `&omitscript=true` to the oEmbed request URL — smaller cached payload (both in cache-store.ts and over the GraphQL wire), one less inline script tag for the browser to parse per embed, no behavior change since embed.js is already loaded separately. Low risk, no architecture decision needed — could be picked up on its own ahead of IDEA-020's larger questions."}

  IDEA-022:
    {type: idea, status: backlog, created: 2026-09-11, parent: IDEA-020,
     impact: user-visible, effort: m,
     title: "Split instagramEmbed out of getEventBySlug into its own query so the Instagram oEmbed round trip stops blocking the whole event-detail page",
     ref: [], touches: [app:backend, web:events],
     note: "Split out of IDEA-020 as the confirmed, scoped root cause of the reported slowness — researched and recommended by Claude 2026-09-11 via bmad-help, user agreed to the parallel-endpoint direction. Verified: `getEventBySlug` is not server-rendered — EventDetailWrapper.tsx:45 fetches it entirely client-side as ONE React Query hook (`useGetEventBySlugQuery`), with `instagramEmbed { ... }` nested inside that same query (queries.graphql:56, resolved server-side by resolvers.ts:3586-3597's field resolver calling resolveInstagramOEmbed). Because it's a single GraphQL request, `isPending` doesn't clear — so the ENTIRE event-detail page (title, date, location, everything) sits in a loading state — until the slowest field, the server-side Meta oEmbed round trip (cache miss = live fetch to graph.facebook.com), resolves. A cache miss today blocks the whole page, not just the embed area.
     Fix: expose `instagramEmbed` as its own query (e.g. a root `instagramEmbedForEvent(postUrl: String!, isImageStorageOptedIn: Boolean!, durableImageUrl: String): InstagramEmbed` field, reusing resolveInstagramOEmbed/resolveInstagramEmbedResult unchanged — no new domain logic, just a new entry point + removing the nested field from `Event`), fired as a second client-side `useQuery` once the main `getEventBySlug` data resolves and `sourcePostUrl`/`originalPostUrl` are known. Main event content then paints immediately; InstagramEmbed.tsx's existing loading skeleton (the `!isReady` branch) covers just the embed area, now driven by the second query's own pending state instead of gating the whole page.
     `@defer` was evaluated and rejected as the alternative (would keep one query): graphql-yoga (this backend, ^5.21.2) only supports it via a separate `@graphql-yoga/plugin-defer-stream` plugin, explicitly documented by Yoga itself as experimental/not-yet-stable with the incremental-delivery spec still in flux, requires clients to send a `multipart/mixed` Accept header, and this frontend's `graphql-request` client is a plain single-JSON-response client that doesn't parse multipart responses — would need a client swap or wrapper just for this one field. The split-query approach needs no new dependencies and directly targets the confirmed bottleneck (one blocking client-side fetch).
     24h server-side oEmbed cache (cache-store.ts) is unaffected either way — this only decouples timing of when the slow field resolves from when the rest of the page can render, not caching behavior. Scoped enough to go straight to bmad-create-story without an architecture pass — unlike IDEA-020's remaining (2)/(3) items (CDN caching, SW/PWA), this one has no open design questions left."}

  # ── 2026-09-11 (bmad-help geoapify-country-bias session) ────────────────────
  BUG-027:
    {type: bug, status: backlog, created: 2026-09-11,
     impact: user-visible, effort: m,
     title: "Geoapify schedule-location geocoding has no country bias, so same-named venues outside the account's own country can be matched",
     ref: [], touches: [app:backend, cross:ai-extraction],
     note: "Raised by user via bmad-help ('some of schedule's map redirect to place outside of the country with similar name'). Confirmed: yes, Geoapify is the only geolocation provider (CC-004) and IS what resolves schedule locations — resolveAccountAndLocations() (apps/backend/src/lib/ai-processor/resolve-account-and-locations.ts:44-66) takes the AI-extracted `schedule.location` free-text string (falling back to the account's own `defaultLocation.formattedAddress`/`placeName` if the schedule has none) and geocodes it via `resolveLocationSeam({kind:'ADDRESS', address})` -> adapter.ts's resolveLocation -> geoapify-client.ts's geocodeAddress(). That function's request URL (geoapify-client.ts:29) is built from only `text`/`format`/`limit`/`apiKey` — no `filter=countrycode:` or `bias=countrycode:`/`bias=proximity:` param, so a venue name that also exists in another country can outrank the intended local match with nothing to disambiguate. This is best-effort enrichment (errors are swallowed, resolve-account-and-locations.ts:58-64) so it fails silently into a wrong-country pin rather than a visible error.
     Scoping gap found: there is no 'account's country' to bias with today. LocationDetails (packages/shared-types/src/index.ts:60-71) stores `city`/`province`/`adminArea` but no `country`/`countryCode` field, and none of the three geoapify-client.ts response mappers (geocodeAddress/reverseGeocode/getPlaceDetails) read Geoapify's own `result.country`/`result.country_code` fields even though Geoapify's API returns them — they're simply dropped today. socialMediaAccountProfiles (packages/database) has a `defaultLocation` jsonb column (LocationDetails-shaped) but, same gap, no explicit country of its own. So this needs: (1) map `country`/`countryCode` through all three geoapify-client.ts response shapes into LocationDetails, (2) decide the source of truth for 'the account's country' — most direct is the country code already embedded in the account's own `defaultLocation` once (1) exists, since that's set from the account's own default location which is itself geocoded — and (3) thread that countryCode into geocodeAddress() as a `filter=countrycode:xx` (hard filter) or `bias=countrycode:xx` (soft preference, falls through if no match) param specifically for schedule-location lookups in resolve-account-and-locations.ts. Open question for whoever scopes this: hard filter vs soft bias — a hard filter would incorrectly exclude a genuine cross-border event (e.g. an account near a national border promoting a trip), so soft bias is likely the safer default; needs a product call, not just an engineering one.
     Related, not yet split out: see IDEA-023 for the event-detail map-link question the user raised in the same message, which is partly a downstream symptom of this same root cause.
     AMENDED (2026-09-11, same session): user proposed also capturing a confidence score per resolved location. Confirmed feasible and cheap to fold into this same fix — Geoapify's geocode/search and /reverse responses already carry a `rank.confidence` (0-1) and `rank.match_type` (e.g. `full_match`, `inner_part`) per result, currently discarded entirely by all three geoapify-client.ts response mappers (only lat/lon/formatted/place_id/timezone/city/province are read today). Recommended: add `confidence?: number` (and ideally `matchType?: string`) to `LocationDetails` and map both through geocodeAddress/reverseGeocode/getPlaceDetails in the same pass as the country field from this item. Confidence is a complementary signal to the country-bias fix above, not a substitute for it — a wrong-country match can still score high confidence when Geoapify's best global text match genuinely sits in another country with nothing telling it to prefer the account's own, and a low-confidence match can equally occur inside the right country (vague/misspelled venue names) — both defenses are needed together. Suggested starting bar: confidence >= 0.5 AND match_type === 'full_match' to treat a resolution as trustworthy, tuned from real data once shipped rather than fixed in advance. See IDEA-023 for how this feeds the event-detail map link decision."}

  IDEA-023:
    {type: idea, status: backlog, created: 2026-09-11, parent: BUG-027,
     impact: cosmetic, effort: s,
     title: "Gate the event-detail Google Maps link on location confidence: use the coordinate when trustworthy, fall back to enriched place text when not",
     ref: [], touches: [web:events, app:backend],
     note: "Raised by user via bmad-help in the same message as BUG-027 ('should we combine placename and coordinate on the google-map link'), then resolved into a concrete design in a follow-up message proposing a confidence-score threshold instead. Confirmed current behavior: mapGraphQLEventToDetailViewProps (apps/web/src/features/events/mapper.ts:48-55) builds the schedule's map link as EITHER `https://www.google.com/maps/search/?api=1&query=<lat>,<lng>` when `locationDetails.coordinates` exists, OR `...?query=<encoded place text>` as a fallback when it doesn't — never conditioned on match quality.
     Combining placeName + coordinates in one query was evaluated and set aside: Google's Maps URL Search API (`/maps/search/?api=1`) takes a single `query` plus an optional `query_place_id`, and `query_place_id` needs a Google Place ID, not the Geoapify place_id this app has (different namespace) — a concatenated `query=<PlaceName>, <lat>,<lng>` string is not an officially supported combination and isn't a reliable fix on its own.
     Adopted design instead (depends on BUG-027's confidence-field addition): once `LocationDetails.confidence`/`matchType` exist, gate the link — confidence >= threshold (proposed starting bar 0.5 + match_type === 'full_match', see BUG-027) uses `query=<lat>,<lng>` as today; below threshold, do NOT fall back to the bare AI-extracted place name alone (that ambiguous string is likely *why* confidence was low, and handing it to Google's own search risks the same wrong-match failure mode) — instead build the fallback query from the fullest available context (place text + whatever city/province/country IS known, from the schedule text, the account's default location, or Geoapify's own `formatted` address), so the fallback is a disambiguated search rather than a repeat of the original ambiguous one. Threshold value and exact fallback-string composition still need to be finalized against real low-confidence examples once BUG-027 ships the field — not yet scoped into a story."}

[workflow]
persistent_facts = [
  "file:{project-root}/_bmad-output/planning-artifacts/story-content-structure.md",
  "Treat story-content-structure.md as the implementation contract for upcoming stories.",
  "When a story is materially non-compliant with the canonical structure, pause and instruct running bmad-create-story validate before continuing implementation.",
  "Before coding, verify the story contains Pre-Coding Approval Gate and that approval to start coding is explicitly granted; if not granted, pause and ask for approval.",
  "If the story's Dev Notes contain an 'Architecture & UX Gate Findings' entry referencing a prerequisite story, check that prerequisite's status in sprint-status.yaml before implementing. If it is not done, pause and ask the user whether to implement the prerequisite first or proceed with the accepted gap.",
  "When implementing a story, enforce strict package dependency rules: State management (react-query, nuqs, zustand) must be installed strictly within apps/web. Testing frameworks (vitest, msw) should use the shared config package (@festgrid/testing-config) if it exists, but playwright must stay in apps/web. Schema validation must be strictly isolated: zod only in apps/web (or specific UI packages) and ajv only in apps/backend. Firebase must be split: firebase-admin strictly in apps/backend and firebase JS SDK strictly in apps/web. Do not mix these distinct domain tools in a single shared package.",
  "Before moving a story's status to 'review' or 'done' in sprint-status.yaml, actually execute every command listed in that story's own 'Verification Plan' section (e.g. `pnpm --filter web build`, `pnpm --filter backend test`, `pnpm --filter web lint`) yourself and confirm each one exits clean — do not mark it verified on the basis that the code matches the plan or that the commands are merely listed in the story file. If any command fails, fix the root cause (or, if it is pre-existing/out of scope, explicitly flag it to the user) before changing status. Record in the story's 'Completion Notes' that these commands were run and their result, not just that the acceptance criteria were implemented.",
  "Scope guard: `_bmad-output/project-context.md` (loaded above) and the FestGrid PRD describe the FestGrid/FestDaily product (`apps/web`, `apps/backend`) only — its Next.js/React/GraphQL/Drizzle ORM/Tailwind-Shadcn/PostHog/next-intl/Firebase stack and package-boundary rules (react-query/nuqs/zustand isolation, zod-vs-ajv, firebase-admin-vs-firebase). When the story being implemented targets `ai-dev-orchestrator/` (its own standalone initiative — see `_bmad-output/specs/spec-ai-dev-orchestrator/` and `_bmad-output/planning-artifacts/architecture/architecture-ai-dev-orchestrator-2026-08-20/`), none of those stack/package rules apply — do not enforce them against this codebase, which has no React/Next.js/GraphQL/Drizzle at all. Generic process rules (story-content-structure.md compliance, Pre-Coding Approval Gate check, executing the story's own Verification Plan commands before marking done, this repo's git commit conventions) still apply regardless of target."
]

on_complete = "After the story status has been updated and all Verification Plan commands have been confirmed passing, stage the files changed for this story (the implementation files plus the story file / sprint-status.yaml status updates) and run `git commit` yourself, with a message following this repo's existing commit style (inspect `git log --oneline` for current convention, e.g. `type(scope): summary`, referencing the story/epic id where relevant). Do not stage or commit unrelated files outside this story's scope. Report the commit hash and message in the final summary."

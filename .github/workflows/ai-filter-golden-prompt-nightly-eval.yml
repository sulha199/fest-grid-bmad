name: Golden-Prompt Live Gemini Eval (nightly)

# Opt-in, nightly drift report for the AI filter's golden-prompt fixture suite (Story 9.7
# AC2). Entirely separate from ci.yml -- a pull_request or push NEVER triggers this workflow,
# and apps/backend/scripts/run-golden-prompt-live-eval.ts is itself a no-op unless
# RUN_LIVE_GEMINI_EVAL=true is set (set only here, never in ci.yml).
#
# The key is a free-tier one (gemini flash, ~20 requests/day), so each night evaluates a
# GOLDEN_EVAL_DAILY_BUDGET-sized window of the suite and leaves the rest pending. A small ledger
# (which fixture was evaluated when, and whether it drifted) carries across nights in the Actions
# cache and decides the next window: new fixtures, then last night's drift, then the stalest.
on:
  schedule:
    - cron: '17 19 * * *' # nightly, off-peak UTC
  workflow_dispatch: {}

jobs:
  golden-prompt-live-eval:
    name: Golden-Prompt Live Gemini Eval (nightly)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workspace packages (@festgrid/domain) resolve to their gitignored dist/ output, so they
      # must be built before the eval script can import them (same rationale as
      # backfill-post-media-keys.yml's own "Build workspace packages" step).
      - name: Build workspace packages
        run: pnpm run build

      # Caches are immutable per key, so each night saves under a fresh key and restores the newest
      # earlier one via the prefix. If the cache is ever evicted the next run simply starts a fresh
      # rotation (every fixture counts as never evaluated).
      - name: Restore golden-eval ledger
        uses: actions/cache/restore@v4
        with:
          path: .golden-eval-state
          key: golden-eval-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: golden-eval-ledger-

      # The save step below runs even when the eval fails, so the path must always exist.
      - name: Ensure ledger directory
        run: mkdir -p .golden-eval-state

      - name: Run golden-prompt live eval
        env:
          RUN_LIVE_GEMINI_EVAL: 'true'
          # Hard cap on Gemini requests per run (retries included), matching the key's daily quota.
          # Fixtures that do not fit stay pending for the next night; a per-day 429 also ends the run
          # early without failing it. Remove this line (full run, ~90 calls) once the key is a paid one.
          GOLDEN_EVAL_DAILY_BUDGET: '20'
          GOLDEN_EVAL_LEDGER_PATH: ${{ github.workspace }}/.golden-eval-state/ledger.json
          # One rotating metamorphic variant per fixture (seed = UTC day); see the script header.
          GOLDEN_EVAL_VARIANTS: 'true'
          # Paces calls (~4.6/min) to stay under the free-tier flash model's per-minute limit, assumed to be
          # 5/min: at the old 4.5s (~13/min, a lite model's 15/min) the nightly hit per-minute 429s, and
          # every retried request spends GOLDEN_EVAL_DAILY_BUDGET. 20 calls take ~4.5 minutes. Set to '0'
          # once GEMINI_NIGHTLY_EVAL_API_KEY is a paid key.
          GOLDEN_EVAL_MIN_INTERVAL_MS: '13000'
          GEMINI_NIGHTLY_EVAL_API_KEY: ${{ secrets.GEMINI_NIGHTLY_EVAL_API_KEY }}
          # loadBackendEnv() (invoked inside callGeminiGenerateContent) requires this; this
          # script never binds a port, so any valid number works (same note as
          # backfill-post-media-keys.yml's BACKEND_PORT usage).
          BACKEND_PORT: '4001'
          # The eval script transitively imports db/client.ts (gemini-client.ts -> guarded-call.ts),
          # which throws at module load without DATABASE_URL. The script itself never queries the
          # DB (it calls callGeminiGenerateContent directly, with no lockKey) and postgres.js
          # connects lazily, so a placeholder suffices -- deliberately NOT secrets.DATABASE_URL,
          # so this job never holds production DB credentials.
          DATABASE_URL: 'postgresql://unused:unused@127.0.0.1:5432/unused'
        run: pnpm --filter backend exec tsx scripts/run-golden-prompt-live-eval.ts

      - name: Save golden-eval ledger
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .golden-eval-state
          key: golden-eval-ledger-${{ github.run_id }}-${{ github.run_attempt }}

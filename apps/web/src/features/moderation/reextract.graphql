mutation PreviewPostReextraction($postId: ID, $url: String) {
  previewPostReextraction(postId: $postId, url: $url) {
    jobId
    errorCode
    errorMessage
  }
}

query PostReextractionPreview($id: ID!) {
  postReextractionPreview(id: $id) {
    status
    errorCode
    errorMessage
    preview {
      applicable
      applied {
        ...ApplyReextractionSummaryFields
      }
      groupingReason
      postStored
      rescraped
      imagesAvailable
      imagesSent
      events {
        extractionOrdinal
        eventName
        alreadyRepresentedBySlug
        isStub
        links {
          url
          label
        }
        schedules {
          title
          startDate
          endDate
          isMain
        }
        dedup {
          tier
          score
          candidateSlug
          candidateName
        }
      }
    }
  }
}

fragment ApplyReextractionSummaryFields on ApplyReextractionSummary {
  groupingReason
  reused {
    slug
    eventName
    ordinal
  }
  created {
    slug
    eventName
    ordinal
  }
  linkedToExisting {
    slug
    eventName
  }
  queuedForReview
  skippedDeleted
  orphans {
    slug
    eventName
  }
}

mutation ApplyPostReextraction($jobId: ID!) {
  applyPostReextraction(jobId: $jobId) {
    errorCode
    errorMessage
    summary {
      ...ApplyReextractionSummaryFields
    }
  }
}

name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: festgrid
          POSTGRES_PASSWORD: festgrid
          POSTGRES_DB: festgrid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://festgrid:festgrid@localhost:5432/festgrid_test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      - name: Run build
        run: pnpm run build

      - name: Run Database Migrations (test DB)
        run: pnpm --filter @festgrid/database run migrate

      - name: Seed test DB
        run: pnpm --filter @festgrid/database run seed

      - name: Run tests
        env:
          BACKEND_PORT: '4001'
          GEOAPIFY_API_KEY: 'test-geoapify-key'
        run: pnpm run test

      # `pnpm run test` fails the build if packages/domain drops below 100% (packages/domain/.c8rc.json).
      # This keeps the README's coverage badge honest: it fails if docs/badges/domain-coverage.json
      # no longer matches the measured coverage.
      - name: Verify coverage badge is current
        run: node scripts/coverage-badge.mjs --check

  # Playwright end-to-end suite (apps/web/e2e) against a production build of the web app and the backend
  # on a seeded Postgres. Sign-in and the Geoapify address lookups are answered by local stand-ins
  # (E2E_FAKE_AUTH=1, see apps/web/test-support), so the job needs no secrets and makes no calls to
  # Supabase or Geoapify. Deliberately not in `needs` of db-migrate / deploy-infrastructure yet: a red
  # run is reported on the commit/PR but does not block the production deploy.
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: festgrid
          POSTGRES_PASSWORD: festgrid
          POSTGRES_DB: festgrid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://festgrid:festgrid@localhost:5432/festgrid_test
      E2E_FAKE_AUTH: '1'
      BACKEND_PORT: '4001'
      GEOAPIFY_API_KEY: 'test-geoapify-key'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-e2e-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-e2e-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The web app and the backend consume the workspace packages from their built `dist`. Playwright
      # builds the web app itself (`pnpm build && pnpm start`) and runs the backend from source, so only
      # their dependencies are built here.
      - name: Build workspace packages
        run: pnpm exec turbo run build --filter='web^...' --filter='backend^...'

      - name: Run Database Migrations (test DB)
        run: pnpm --filter @festgrid/database run migrate

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      # global-setup seeds the database before the first spec.
      - name: Run end-to-end tests
        run: pnpm --filter web run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  db-migrate:
    name: Database Migrations
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    concurrency:
      group: db-migrate
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Database Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd packages/database
          pnpm run migrate

  deploy-infrastructure:
    name: Deploy Infrastructure to AWS
    needs: [ci, db-migrate]
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    concurrency:
      group: deploy-infrastructure
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy CDK Stack (Prod)
        env:
          DEPLOY_STAGE: prod
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ vars.FIREBASE_CLIENT_EMAIL }}
          SES_FROM_EMAIL_ADDRESS: ${{ vars.SES_FROM_EMAIL_ADDRESS }}
          SYSTEM_ERROR_ALERT_EMAIL: ${{ vars.SYSTEM_ERROR_ALERT_EMAIL }}
          OPS_ALERT_EMAIL: ${{ vars.OPS_ALERT_EMAIL }}
          WEB_APP_BASE_URL: ${{ vars.WEB_APP_BASE_URL }}
          API_KEY_USAGE_CYCLE_DAYS: ${{ vars.API_KEY_USAGE_CYCLE_DAYS }}
          SCRAPER_USAGE_CYCLE_DAYS: ${{ vars.SCRAPER_USAGE_CYCLE_DAYS }}
          GEMINI_POSTS_PER_KEY_PER_CYCLE: ${{ vars.GEMINI_POSTS_PER_KEY_PER_CYCLE }}
        run: pnpm --filter infrastructure exec cdk deploy FestgridBackendStack-prod --require-approval never

  # ── 2026-09-15 (bmad-agent-architect event-detail page perf audit) ──────────
  BUG-035:
    {type: bug, status: triaged, created: 2026-09-15,
     impact: user-visible, effort: m,
     title: "eventBySlug's full resolver fan-out runs twice per page load — generateMetadata's server fetch is discarded, then EventDetailWrapper re-fetches the identical over-fetching query client-side",
     ref: [_bmad-output/project-context.md, planning-artifacts/sprint-change-proposal-2026-09-15-getevents-eventbyslug-perf-hardening.md],
     touches: [web:events/eventBySlug, app:backend, cross:architecture],
     note: "Found via bmad-agent-architect audit (2026-09-15), following up on AD-16's event-detail perf-priority rule. apps/web/src/app/[locale]/events/[slug]/page.tsx:21 and the modal's @modal/(.)events/[slug]/page.tsx:21 both call graphqlClient.request(GetEventBySlugDocument, {slug}) server-side inside generateMetadata — but only read eventName/description from the result (page.tsx:23-26) before discarding it entirely. EventDetailWrapper.tsx:45-48 then fires the identical useGetEventBySlugQuery/document client-side after hydration. No React.cache()/unstable_cache anywhere in apps/web/src (verified), lib/graphql-client.ts is a bare graphql-request client with no dedup, and no HydrationBoundary/dehydrate seeds the client cache from the server fetch — so the entire resolver chain (BUG-033/BUG-034 below, plus sourceSocialMediaAccountProfile/isFavorited/favoriteCount/isHiddenForCurrentUser) runs fully twice per pageview, on both the full-page and modal-intercepted routes. Compounds itself further: EventDetailWrapper.tsx:317-326's router.prefetch() for the adjacent next/prev event (full-page route only, per its own code comment at 303-316) speculatively triggers this same doubled+over-fetching chain for a page the user may never open, discarded if they don't navigate. generateMetadata itself also over-fetches independently of the duplication — it needs only 2 scalar fields but requests the full document (schedules, isFavorited, favoriteCount, instagramEmbed, etc.), so even a standalone fix to the duplication should also narrow generateMetadata's own query. Fix direction (not yet designed): either seed the client React Query cache from generateMetadata's/a shared server fetch via HydrationBoundary+dehydrate, or give generateMetadata its own minimal query requesting only eventName/description so at minimum the wasted server-side fetch is cheap. Not yet scoped into a story."}

  BUG-033:
    {type: bug, status: triaged, created: 2026-09-15,
     impact: user-visible, effort: s,
     title: "Schedule.isAddedToCalendar N+1 on the event-detail page — same shape as getEvents' BUG-030, scoped to one event's schedule list",
     ref: [_bmad-output/project-context.md, planning-artifacts/sprint-change-proposal-2026-09-15-getevents-eventbyslug-perf-hardening.md],
     touches: [app:backend, web:events/eventBySlug, pkg:graphql-select],
     note: "Found via bmad-agent-architect audit (2026-09-15). apps/backend/src/schema/resolvers.ts's Schedule.isAddedToCalendar field resolver (~3727-3741) is invoked once per schedule row returned by the schedules field (~3619-3625) — no DataLoader or batching exists anywhere in apps/backend/src (grepped, zero hits). For a multi-schedule (recurring/multi-day) event this is N separate DB round trips for a single eventBySlug call, doubled by BUG-035. Same defect class as BUG-030's getEvents N+1 (per-row field resolver instead of a batched/EXISTS-subquery form), just bounded by one event's schedule count instead of a full page of events — lower severity than BUG-030 but same fix pattern applies (batch via the schedule ids already known from the parent select, or a per-request DataLoader). Not yet scoped into a story."}

  BUG-034:
    {type: bug, status: triaged, created: 2026-09-15,
     impact: user-visible, effort: xs,
     title: "favorites has no index with eventId as a leading column — favoriteCount full-scans the table on every eventBySlug call",
     ref: [_bmad-output/project-context.md, planning-artifacts/sprint-change-proposal-2026-09-15-getevents-eventbyslug-perf-hardening.md],
     touches: [pkg:database, app:backend],
     note: "Found via bmad-agent-architect audit (2026-09-15). The favoriteCount field resolver (apps/backend/src/schema/resolvers.ts:3664-3672) queries `WHERE eventId = X AND deletedAt IS NULL`, but favorites (packages/database/schema.ts) only carries `unique(userId, eventId)` (:411) and a partial index on `userId` alone (`activeIdx`, :412) — neither has `eventId` as a leading/usable column for this query shape, forcing a full table scan of favorites on every single eventBySlug call. Doubled by BUG-035, and multiplied further by BUG-035's prefetch case. Fix: add a partial index on `(eventId)` scoped to `WHERE deleted_at IS NULL`, matching AD-8 rule 3's existing partial-index convention for this exact table family (subject to AD-8 rule 3's documented drizzle-kit WHERE-clause-dropping limitation — the migration will need the same hand-edit workaround already used for idx_favorites_active). Not yet scoped into a story."}

  FIND-030:
    {type: finding, status: triaged, created: 2026-09-15,
     impact: internal, effort: xs,
     title: "useGetMySubscriptionsQuery fires unconditionally on session presence on the event-detail page, with no shell-level warm cache unlike useMeQuery",
     ref: [planning-artifacts/sprint-change-proposal-2026-09-15-getevents-eventbyslug-perf-hardening.md], touches: [web:events/EventDetailWrapper, app:backend],
     note: "Found via bmad-agent-architect audit (2026-09-15). EventDetailWrapper.tsx:58-64 calls useGetMySubscriptionsQuery gated only on `enabled: !!session`, regardless of whether the event even has a linked source account — it's consumed solely to compute isSubscribedToAccount for the 'subscribe to source account' button (EventDetailWrapper.tsx:259-270). Unlike useMeQuery (confirmed a genuine cache-hit — AppShellWrapper.tsx:31-33 fires the identical ['me']-keyed query in the root layout on every route, so EventDetailWrapper's copy is deduped by the shared QueryClient's 30s staleTime), no queryKey ['getMySubscriptions'] fetch exists at the shell level — only in feed-content.tsx:54, onboarding-subscribe-step.tsx:21, and subscriptions-content.tsx:39. A direct entry to event detail (share link, search result, Discover card) triggers a real, otherwise-unneeded network call for events with no linked account at all. Fix direction: gate the query on the event actually having a sourceSocialMediaAccountProfile, or lift it to shell-level like useMeQuery if it's cheap and commonly needed. Not yet scoped into a story."}

  FIND-031:
    {type: finding, status: triaged, created: 2026-09-15,
     impact: cosmetic, effort: xs,
     title: "Event-detail page client-side hygiene: unmemoized prop mapper, raw <img> instead of next/image on hero and carousel-peek images",
     ref: [], touches: [web:events/EventDetailWrapper, pkg:ui],
     note: "Found via bmad-agent-architect audit (2026-09-15), secondary to the backend findings above. mapGraphQLEventToDetailViewProps(...) runs unmemoized in EventDetailWrapper.tsx's render body (~461-463), rebuilding the schedules array on every re-render (dialog open/close, liveMessage updates) — likely cheap for a single event, but not memoized. Both the hero image (packages/ui/src/features/events/EventImage.tsx:88-91) and the carousel-peek images (event-preview-card.tsx:41-47) use raw <img>, not next/image — no responsive srcset/format optimization; the peek images additionally have no loading=\"lazy\". Low priority relative to BUG-032/033/034; bundled as one item since all three are event-detail-page client-side polish, not separate root causes. Not yet scoped into a story."}


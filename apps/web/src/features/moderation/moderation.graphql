query getReportedEvents($status: ReportStatus, $reason: ReportReason) {
  reportedEvents(status: $status, reason: $reason) {
    id
    eventId
    reporterUserId
    reason
    details
    status
    createdAt
    moderatorIgnored
    event {
      id
      slug
      eventName
      imageUrl
      deletedAt
    }
  }
}

mutation resolveReportsForEvent($eventId: ID!) {
  resolveReportsForEvent(eventId: $eventId) {
    id
    status
    resolvedAt
  }
}

mutation deleteEventPermanently($id: ID!) {
  deleteEventPermanently(id: $id)
}

mutation ignoreSubsequentReports($reportId: ID!) {
  ignoreSubsequentReports(reportId: $reportId) {
    id
    moderatorIgnored
  }
}

query getPendingDefaultLocationChanges {
  pendingDefaultLocationChanges {
    id
    accountId
    status
    createdAt
    account {
      id
      displayName
      platform
      username
      profileImageUrl
    }
    previousLocation {
      placeName
      formattedAddress
      coordinates {
        lat
        lng
      }
    }
    newLocation {
      placeId
      placeName
      formattedAddress
      coordinates {
        lat
        lng
      }
    }
  }
}

mutation resolveDefaultLocationChange($id: ID!, $action: DefaultLocationChangeAction!) {
  resolveDefaultLocationChange(id: $id, action: $action) {
    id
    status
  }
}

query queryUnprocessedPayloads($filters: UnprocessedPayloadFilters, $cursor: String, $limit: Int) {
  queryUnprocessedPayloads(filters: $filters, after: $cursor, first: $limit) {
    edges {
      node {
        id
        rawPayload
        validationError {
          message
        }
        context {
          source
          scraperVendor
          accountId
          postUrl
          timestamp
          parserVersion
        }
        createdAt
        deletedAt
      }
      cursor
    }
    pageInfo {
      hasNextPage
      endCursor
    }
    totalCount
  }
}

mutation reprocessPayload($payloadId: ID!, $parserVersion: String!) {
  reprocessPayload(payloadId: $payloadId, parserVersion: $parserVersion) {
    success
    message
  }
}

mutation deleteUnprocessedPayload($payloadId: ID!) {
  deleteUnprocessedPayload(payloadId: $payloadId)
}

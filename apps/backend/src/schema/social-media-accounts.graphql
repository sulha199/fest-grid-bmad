type SocialMediaAccountProfile {
  id: ID!
  accountId: String!
  platform: String!
  displayName: String!
  username: String!
  profileImageUrl: String
  description: String
  lastPostDate: String
  lastScrapedAt: String
  isScrapeInProgress: Boolean!
  defaultLocation: LocationDetails
  hasPendingDefaultLocationReview: Boolean!
  accountType: String
  accountTypeStatus: String
  isImageStorageOptedIn: Boolean!
  imageStorageOptInSource: ImageStorageOptInSource
}

enum ImageStorageOptInSource {
  MODERATOR
  ACCOUNT_OWNER
}

input ModeratorAccountProfileFilters {
  search: String
}

type SocialMediaAccountProfileEdge {
  node: SocialMediaAccountProfile!
  cursor: String!
}

type SocialMediaAccountProfileConnection {
  edges: [SocialMediaAccountProfileEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

extend type Query {
  socialMediaAccountProfileByAccountId(
    platform: String!
    accountId: String!
  ): SocialMediaAccountProfile

  queryModeratorAccountProfiles(
    filters: ModeratorAccountProfileFilters
    first: Int
    after: String
  ): SocialMediaAccountProfileConnection!
}

input SetAccountDefaultLocationInput {
  placeId: String
  latitude: Float
  longitude: Float
}

extend type Mutation {
  setAccountDefaultLocation(accountId: ID!, input: SetAccountDefaultLocationInput!): SocialMediaAccountProfile!
  editAccountDefaultLocation(accountId: ID!, input: SetAccountDefaultLocationInput!, asModeratorCorrection: Boolean): SocialMediaAccountProfile!
  setImageStorageOptIn(accountId: ID!, optedIn: Boolean!): SocialMediaAccountProfile!
}

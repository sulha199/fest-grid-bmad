name: Backfill Scraper Audit Trail

# Manual-only, dedicated workflow — never runs on push/pull_request, and is separate from
# ci.yml so a manual trigger only ever runs this backfill, not the full CI/CD pipeline.
# Runbook: docs/infrastructure/incidents/2026-09-05-scraper-audit-trail-gap.md#backfilling-already-orphaned-rows
#
# The backfill input JSON is NOT passed as a workflow input (GitHub Actions caps inputs
# well below the size these files reach, and it must never be committed to the repo or
# exposed in logs/URLs). Instead it's uploaded ahead of time to the private
# OpsBackfillBucket-prod S3 bucket (CDK: apps/infrastructure/lib/festgrid-backend-stack.ts,
# output "opsBackfillBucketName") — public access is fully blocked on that bucket and
# objects auto-expire after 7 days regardless. This job downloads it, runs the backfill,
# and only deletes the S3 object itself when apply=true (a dry run leaves the file in
# place so it can be re-run, including with apply=true, without re-uploading).
on:
  workflow_dispatch:
    inputs:
      backfill_s3_key:
        description: >-
          S3 object key (inside the OpsBackfillBucket-prod bucket) of the backfill input
          JSON. Upload the file first with:
          aws s3 cp ./runs.json s3://<OpsBackfillBucket-prod bucket name>/<key>
          (bucket name is the CDK stack's opsBackfillBucketName output). See
          docs/infrastructure/incidents/2026-09-05-scraper-audit-trail-gap.md for the
          exact JSON shape and full runbook.
        required: true
        type: string
      apply:
        description: 'Commit changes (unchecked = dry run, writes nothing, keeps the S3 file)'
        required: true
        type: boolean
        default: false
      window_hours:
        description: 'Fuzzy-match time window (+/- hours) for relinking posts/unprocessed_scraper_payloads'
        required: false
        type: number
        default: 2

jobs:
  backfill-scraper-audit-trail:
    name: Backfill Scraper Audit Trail (manual)
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: backfill-scraper-audit-trail
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Resolve Ops Backfill Bucket name
        id: bucket
        run: |
          NAME=$(aws cloudformation describe-stacks \
            --stack-name FestgridBackendStack-prod \
            --query "Stacks[0].Outputs[?OutputKey=='opsBackfillBucketName'].OutputValue" \
            --output text)
          if [ -z "$NAME" ] || [ "$NAME" = "None" ]; then
            echo "::error::Could not resolve opsBackfillBucketName from FestgridBackendStack-prod outputs."
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Download backfill input from S3
        run: |
          aws s3 cp "s3://${{ steps.bucket.outputs.name }}/${{ inputs.backfill_s3_key }}" ./backfill-input.json

      - name: Skip if input file is empty
        id: check-file
        run: |
          SIZE=$(stat -c%s ./backfill-input.json 2>/dev/null || stat -f%z ./backfill-input.json)
          if [ "$SIZE" -eq 0 ]; then
            echo "::warning::backfill-input.json is empty (0 bytes) — skipping run, nothing to backfill."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$(cat ./backfill-input.json | tr -d '[:space:]')" = "[]" ]; then
            echo "::warning::backfill-input.json is an empty JSON array — skipping run, nothing to backfill."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run backfill
        if: steps.check-file.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd packages/database
          ARGS="backfill --input ../../backfill-input.json --window-hours ${{ inputs.window_hours }}"
          if [ "${{ inputs.apply }}" = "true" ]; then
            ARGS="$ARGS --apply"
          else
            echo "::notice::Running in DRY RUN mode — nothing will be written. Re-run with 'apply: true' to commit."
          fi
          npx tsx backfill-scraper-actor-runs.ts $ARGS

      # Only delete on a real (apply=true) run — a dry run leaves the S3 object in place so
      # it can be reviewed/re-run (including as the eventual --apply run) without
      # re-uploading. The bucket's own 7-day lifecycle rule is still the backstop either way.
      - name: Delete backfill input from S3
        if: always() && inputs.apply == 'true'
        run: |
          aws s3 rm "s3://${{ steps.bucket.outputs.name }}/${{ inputs.backfill_s3_key }}" || true

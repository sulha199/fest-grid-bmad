[workflow]
persistent_facts = [
  "Backlog board: this project keeps a second, smaller board at `_bmad-output/implementation-artifacts/backlog.yaml` tracking pre-story work — Sprint Change Proposals, bugs, findings and raw ideas — that `sprint-status.yaml` has no room for. Its convention is `_bmad-output/implementation-artifacts/backlog-spec.md`. Sprint status is not complete without it: a story board alone hides everything proposed but never promoted, which is most of the open work.",
  "Board separation is deliberate and must be preserved: `sprint-status.yaml` is ~140KB and read by the story hot path, so backlog items are never migrated into it. Report the two together; keep them stored apart.",
]

activation_steps_append = [
  "Read `_bmad-output/implementation-artifacts/backlog.yaml` (rows plus the tag registry). It is small by design — read it whole. Do not read the documents its rows reference; the rows are the summary.",
  "Run `uv run --python 3.11 --with pyyaml scripts/backlog-check.py` from the project root. It executes checks 1-9, the check-7 collision grouping, and every §11 lens, and its exit code is the failure count. Use its output for sections 4, 5 and 6 of the readout below rather than re-deriving any of them by hand — a hand-rolled reimplementation that is subtly wrong reports \"clean\" on a broken board. If the script itself fails to run, say so plainly and fall back to reading `backlog-spec.md` §9 and §11; do not silently skip the checks.",
]

on_complete = """
Extend the sprint status summary with a Backlog Board section, after the story/epic
status and alongside the retrospective action items. Report, in this order:

1. **Counts by status** — `backlog`, `triaged`, `promoted`, `done`, `skipped`,
   `superseded` — and by type. State the total row count.

2. **Derived-status reconciliation.** For every item carrying `stories`, look each key up
   in `sprint-status.yaml`: all terminal (`done` or `wont-do`) means the item derives to
   `done`, anything else means `promoted`. Flag any row whose written status disagrees
   with what it derives to — that disagreement is the drift this board exists to catch.
   Note explicitly when an item's stories are all `review` rather than `done`: that is
   `promoted (awaiting close-out)`, not finished, and it is this project's most common
   state.

3. **Open children.** List rows with a `parent` whose status is `backlog` or `triaged`,
   grouped under their parent. A parent cannot be `done` while any child is open, so
   surface any parent that violates this. These are the partially-promoted batches.

4. **Integrity checks** (spec section 9): broken `ref` paths, referenced files whose
   `backlog_id` is missing or disagrees with the row, `touches` tags absent from the
   registry, `stories` keys absent from `sprint-status.yaml`, open items whose stories are
   all terminal, `parent` ids that do not exist, open un-promoted rows missing `impact` or
   `effort` or carrying a value outside the §3 enums, and `blocks` entries naming an id
   that does not exist or one whose target is already terminal. Report only failures; say
   "clean" when there are none.

   An unranked open row is not a cosmetic omission — it cannot appear in any lens, so it
   is silently unprioritizable rather than merely undecorated. Name those rows explicitly.

5. **Target collisions.** Group open items (`backlog`/`triaged`/`promoted`) by `touches`
   tag prefix, deduplicating items within a group. **Report groups ascending by size and
   suppress any group larger than 4** — a tag shared by a third of the board carries no
   signal, while small groups are where real conflicts surface. Present these as
   candidates for a human read, never as confirmed conflicts: semantic contradictions
   between items that share no tag are not mechanically detectable.

6. **Lens readout** (spec section 11). Lenses are defined in backlog-spec.md §11 and
   nowhere else — read that table rather than reconstructing the filters from memory, and
   never copy one into a row. Report `unblock` first (those rows gate other work
   regardless of their own size), then `cheap-wins`, then `stability`, each as an id list
   with one-line titles. Omit any lens returning nothing.

   Do **not** rank the lenses against each other or present a single "do this next" list.
   Which lens applies depends on what the user is doing this session, and that judgment is
   theirs — the board's job is to make each candidate set cheap to see. If the user stated
   a goal for the session, run the lens matching that goal instead of the default three.

Keep this section terse — counts, ids and one-line titles. It is a status readout, not a
report; the user opens a referenced document only when they choose to act on a row.
"""

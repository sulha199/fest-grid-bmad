enum WidgetDisplayMode {
  CARD
  CALENDAR
}

enum WidgetTheme {
  DARK
  LIGHT
}

type Widget {
  id: ID!
  ownerUserId: ID!
  filters: EventFilter
  expression: FilterNode!
  displayMode: WidgetDisplayMode!
  theme: WidgetTheme!
  createdAt: String!
  deletedAt: String
}

# What the public, unauthenticated embed page may read (Story 6.5a AC6). It carries no owner and no
# deletion state: `Query.widgetById` needs no session, so its return type must not name a user (AD-7).
type PublicWidget {
  id: ID!
  filters: EventFilter
  expression: FilterNode!
  displayMode: WidgetDisplayMode!
  theme: WidgetTheme!
  createdAt: String!
}

input CreateWidgetInput {
  filters: EventFilterInput
  expression: FilterNodeInput
  displayMode: WidgetDisplayMode
  theme: WidgetTheme
}

input UpdateWidgetInput {
  filters: EventFilterInput
  expression: FilterNodeInput
  displayMode: WidgetDisplayMode
  theme: WidgetTheme
}

extend type Query {
  myWidgets: [Widget!]!
  widgetById(id: ID!): PublicWidget
}

extend type Mutation {
  createWidget(input: CreateWidgetInput!): Widget!
  updateWidget(id: ID!, input: UpdateWidgetInput!): Widget!
  deleteWidget(id: ID!, action: SoftDeleteAction!): Widget!
}

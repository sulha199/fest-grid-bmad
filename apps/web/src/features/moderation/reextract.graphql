mutation PreviewPostReextraction($postId: ID, $url: String) {
  previewPostReextraction(postId: $postId, url: $url) {
    jobId
    errorCode
    errorMessage
  }
}

# Story 10.6a (show the Re-extract progress, the missing-images banner and Retry) -- the moderator-only refresh report of one Re-extract job
# and when its preview stops being applicable. Read once for an ended job: an ended job's report does not change.
query ReextractJobReport($id: ID!) {
  job(id: $id) {
    id
    outcome {
      previewApplyUntil
      previewApplied
    }
    refresh {
      outcome
      saved
      lateResultPending
      retryAfter
      expiredLinks
      images {
        position
        role
        state
      }
      imagesAvailable
      imagesRead
      previewImageCap
    }
  }
}

query PostReextractionPreview($id: ID!) {
  postReextractionPreview(id: $id) {
    status
    errorCode
    errorMessage
    preview {
      applicable
      applied {
        ...ApplyReextractionSummaryFields
      }
      groupingReason
      postStored
      rescraped
      imagesAvailable
      imagesSent
      events {
        extractionOrdinal
        eventName
        alreadyRepresentedBySlug
        isStub
        links {
          url
          label
        }
        schedules {
          title
          startDate
          endDate
          isMain
        }
        dedup {
          tier
          score
          candidateSlug
          candidateName
        }
      }
    }
  }
}

fragment ApplyReextractionSummaryFields on ApplyReextractionSummary {
  groupingReason
  reused {
    slug
    eventName
    ordinal
  }
  created {
    slug
    eventName
    ordinal
  }
  linkedToExisting {
    slug
    eventName
  }
  queuedForReview
  skippedDeleted
  orphans {
    slug
    eventName
  }
}

mutation ApplyPostReextraction($jobId: ID!) {
  applyPostReextraction(jobId: $jobId) {
    errorCode
    errorMessage
    summary {
      ...ApplyReextractionSummaryFields
    }
  }
}

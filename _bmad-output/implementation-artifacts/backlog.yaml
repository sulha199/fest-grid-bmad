  # ── 2026-09-17 (bmad-architecture, calendar overflow data-fetching session) ─
  BUG-036:
    {type: bug, status: promoted, created: 2026-09-17,
     impact: user-visible, effort: m,
     stories: [1-i1h-shared-calendar-overflow-dialog-and-fair-per-day-fetching],
     title: "Query.events' flat ORDER BY next-upcoming-date ASC LIMIT 1000 can let one popular day silently starve a later day in the same visible week",
     ref: [planning-artifacts/festgrid-architecture-spine.md],
     touches: [app:backend, web:events/WeeklyCalendarView, cross:architecture],
     note: "Found while designing FIND-026's calendar overflow fetch (Architecture Spine AD-23). CalendarView.tsx fetches the entire visible week in one shot (useGetEventsForCalendarQuery, limit:1000); the resolver's default ordering (resolvers.ts:3130-3157, Story 2.7's next-upcoming-date ASC chain) has no per-day floor. If an early day in the week has enough events to consume most/all of the 1000-row budget, a later day in the SAME week can come back with zero or artificially few events — with no signal to the client that truncation happened, unlike a correctly-capped day which at least shows '+N more'. Pre-existing, independent of the FIND-026 redesign — not a byproduct of it. AD-23's decided fix: replace the flat ORDER BY/LIMIT with a SQL window function partitioned per day (ROW_NUMBER() OVER (PARTITION BY event_start_date ORDER BY event_start_time ASC NULLS LAST, id ASC) <= N), excluding multi-day/day-of-week-collapsed schedules from the partition (fetched unconditionally alongside it, same exempt-set principle EXPERIENCE.md already established for rendering). Sequencing (user-confirmed): ships in the same story as FIND-026/IDEA-025/026's calendar-overflow-dialog work, since both touch the same fetch surface, but tracked here as its own row since it's an independently-discovered pre-existing defect.
     PROMOTED (2026-09-17 via bmad-create-story, deterministic match — Story 1.i1h's own epics.md section cites this row by id): carved out of IDEA-026's Story 1.i1f during Gate 2, alongside FIND-026's own overflow-dialog scope, into Story 1.i1h — the per-day window-function fetch fix plus the resolver's outer-ORDER-BY tie-break sort needed for the overflow dialog's own paginated continuation to stay stable. Not yet implemented (Story 1.i1h is itself still `backlog`, drafted only as an epics.md section pending its own bmad-create-story pass)."}

  # ── 2026-09-18 (user-reported, direct code investigation) ────────────────────
  FIND-035:
    {type: finding, status: triaged, created: 2026-09-18,
     impact: internal, effort: s,
     title: "Daily scraper batch cron re-requests a fixed 7-day window for every account every day instead of scraping incrementally",
     ref: [backlog/FIND-035-scraper-batch-non-incremental-window.md],
     touches: [app:backend, cross:process],
     note: "scraper.ts's EventBridge-triggered daily batch path hardcodes newerThan = now-7days for every account every run (~6-day overlap with the previous day's window, forever). The correct incremental logic already exists in this codebase at process-scrape-job.ts:132-139 (use newestPost.publishedAt, falling back to env.scrapeInitialLookbackDays only for a genuinely first-ever scrape) but is only wired into the SQS-fallback path, never the primary async-trigger path that actually drives the cron. Matters more than a queue-cost issue: this is recurring metered Bright Data/Apify vendor cost, not AWS free-tier float. Fix: extend getBatchScrapeTargets() with a MAX(publishedAt) GROUP BY accountId join, wire it into scraper.ts's newerThan calc. Prioritized ahead of FIND-024/FIND-022/IDEA-010 in the FIND-034 ritual-orchestrator batch (.batch-plan-find034-cluster.json) per user direction — low-risk, high-value, reuses a proven existing pattern, no architectural/UX ambiguity."}

  # ── 2026-09-18 (found+fixed by a ritual-orchestrator quick-dev auto-fix dispatch) ──
  BUG-037:
    {type: bug, status: done, created: 2026-09-18,
     impact: user-visible, effort: xs,
     title: "createApiKey's duplicate-key check compared against every user's active keys, not just the caller's own",
     ref: [],
     touches: [app:backend],
     note: "resolvers.ts:434's activeKeys query for the DUPLICATE_API_KEY check had no apiKeys.userId filter -- decrypted and compared every active key for the given provider across ALL users on every createApiKey call, so User A could get a false DUPLICATE_API_KEY block because User B happens to have registered the identical key text, and every key-add unnecessarily decrypted other users' secrets into memory. Found incidentally: the BUG-015/FIND-020/FIND-017/IDEA-015 ritual-orchestrator quick-dev dispatch (2026-09-18) never actually implemented its own target scope (spec-only, no code landed) but its post-check auto-fix pass, triggered by 2 real pre-existing test failures, correctly root-caused and fixed this one plus an unrelated Story 4.8 test-isolation flake (resolvers.test.ts's 'events - includeMyArchived opt-in bypass' used fixed literal user IDs that collided with rows other tests create via unfiltered LIMIT N selects -- switched to crypto.randomUUID() + defensive accountVotes cleanup). Fix: added eq(apiKeys.userId, authUser.userId) to the activeKeys query. Verified independently: all 74 tests in resolvers.test.ts pass (targeted re-run, not the full suite)."}


type Mutation {
  toggleFavorite(eventId: ID!): ToggleFavoriteResult!
  toggleCalendarAddition(eventId: ID!, scheduleId: ID!): ToggleCalendarAdditionResult!
}

type ToggleFavoriteResult {
  eventId: ID!
  isFavorited: Boolean!
  favoriteCount: Int!
}

type ToggleCalendarAdditionResult {
  eventId: ID!
  scheduleId: ID!
  isAddedToCalendar: Boolean!
}

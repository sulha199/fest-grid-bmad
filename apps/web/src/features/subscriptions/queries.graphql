query getMySubscriptions {
  mySubscriptions {
    id
    accountId
    isNewlyAdded
    isInactive
    createdAt
    pendingExtractionCount
    account {
      id
      platform
      displayName
      username
      profileImageUrl
      isScrapeInProgress
      lastScrapedAt
      defaultLocation {
        coordinates {
          lat
          lng
        }
        formattedAddress
        placeName
      }
      hasPendingDefaultLocationReview
    }
  }
}

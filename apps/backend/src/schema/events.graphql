enum ScheduleTimezoneStatus {
  RESOLVED
  NEEDS_CLARIFICATION
}

type Coordinates {
  lat: Float!
  lng: Float!
}

type LocationDetails {
  coordinates: Coordinates!
  placeName: String
  placeId: String
  formattedAddress: String
  timezone: String
  city: String
  province: String
  adminArea: String
  venueType: String
}

type EventLink {
  url: String!
  label: String
}

type Schedule {
  id: ID!
  eventId: ID!
  isMainSchedule: Boolean!
  title: String
  eventStartDate: String!
  eventEndDate: String
  eventStartTime: String
  eventEndTime: String
  timezone: String
  timezoneStatus: ScheduleTimezoneStatus
  performers: [String!]
  location: String
  locationDetails: LocationDetails
  ticketPrice: String
  ticketUrl: String
  registrationUrl: String
  updatedAt: String!
  createdAt: String!
  isAddedToCalendar: Boolean!
  applicableDaysOfWeek: [DayOfWeek!]
}

type Event {
  id: ID!
  eventName: String!
  slug: String!
  description: String
  types: [EventType!]
  categories: [EventCategory!]
  location: String
  sourceSocialMediaAccountId: ID
  postId: ID
  imageUrl: String
  durableImageUrl: String
  videoUrl: String
  instagramEmbed: InstagramEmbed
  sourcePostUrl: String
  originalPostUrl: String
  publishedAt: String
  organizerName: String
  contactInfo: String
  hasPrivateContact: Boolean!
  links: [EventLink!]
  updatedAt: String!
  createdAt: String!
  schedules: [Schedule!]!
  isFavorited: Boolean!
  favoriteCount: Int!
  isAddedToCalendar: Boolean!
  isHiddenForCurrentUser: Boolean!
  sourceSocialMediaAccountProfile: SocialMediaAccountProfile
  coauthors: [SocialMediaAccountProfile!]!
  sourcePosts: [EventSourcePost!]!
  deletedAt: String
  isExpiredForCurrentUser: Boolean!
}

enum PostGroupingReason {
  SINGLE_EVENT
  PROGRAM_LINEUP
  DEPENDENT_STAGES
  SEPARATE_EVENTS
  ROUNDUP
}

type EventSourcePost {
  postId: ID!
  isPrimary: Boolean!
  groupingReason: PostGroupingReason
  extractedEventCount: Int
  postedAt: String
  sourcePostUrl: String
  originalPostUrl: String
  account: SocialMediaAccountProfile
  coauthors: [SocialMediaAccountProfile!]!
  # AC6's "See all N events" link (/posts/{platformSlug}/{postType}/{platformPostId}/events,
  # AD-16's existing slug-segment convention) needs these two alongside account.platform --
  # mirrors AD-16's own posts.platformPostId/platformPostType columns, parsed once at scrape
  # time (parsePlatformPostIdentity), never re-derived here.
  platformPostId: String
  postType: String
}

type RelatedEventGroup {
  postId: ID!
  eventIds: [ID!]!
}

type EventConnection {
  items: [Event!]!
  hasMore: Boolean!
  totalCount: Int!
}

input EventQueryConditionInput {
  operator: String
  conditions: [EventQueryConditionInput!]
  field: String
  value: JSON
}

extend type Query {
  events(query: EventQueryConditionInput, filter: EventFilterInput, limit: Int, offset: Int, perDayLimit: Int, includeSoftDeleted: Boolean, includeMyArchived: Boolean): EventConnection!
  event(id: ID!, includeMyArchived: Boolean): Event
  eventBySlug(slug: String!, includeMyArchived: Boolean): Event
  instagramEmbedBySlug(slug: String!): InstagramEmbedBySlug!
  relatedEventIds(eventId: ID!): [RelatedEventGroup!]!
}

type ResolveScheduleTimezoneResult {
  scheduleId: ID!
  timezone: String!
  timezoneStatus: ScheduleTimezoneStatus!
}

extend type Mutation {
  restoreEvent(id: ID!, action: SoftDeleteAction!): Event!
  deleteEventPermanently(id: ID!): Boolean!
  resolveScheduleTimezone(scheduleId: ID!, timezone: String!): ResolveScheduleTimezoneResult!
}

enum DateAnchor {
  TODAY
  THIS_WEEK
  THIS_MONTH
}

enum DateOffsetUnit {
  DAY
  WEEK
  MONTH
}

enum DayOfWeek {
  MON
  TUE
  WED
  THU
  FRI
  SAT
  SUN
}

input DateRangeFilterInput {
  anchor: DateAnchor!
  offsetAmount: Int!
  offsetUnit: DateOffsetUnit!
}

input CoordinatesInput {
  lat: Float!
  lng: Float!
}

input LocationFilterInput {
  coordinates: CoordinatesInput
  radiusMeters: Int
  adminArea: String
}

enum TemporalFilter {
  TODAY
  UPCOMING
}

input EventFilterInput {
  accountId: ID
  types: [EventType!]
  categories: [EventCategory!]
  keyword: String
  dateRange: DateRangeFilterInput
  dayOfWeek: DayOfWeek
  location: LocationFilterInput
  venueType: String
  isFree: Boolean
  temporalFilter: TemporalFilter
}

type DateRangeFilter {
  anchor: DateAnchor!
  offsetAmount: Int!
  offsetUnit: DateOffsetUnit!
}

type LocationFilter {
  coordinates: Coordinates
  radiusMeters: Int
  adminArea: String
}

type EventFilter {
  accountId: ID
  types: [EventType!]
  categories: [EventCategory!]
  keyword: String
  dateRange: DateRangeFilter
  dayOfWeek: DayOfWeek
  location: LocationFilter
  venueType: String
  isFree: Boolean
}

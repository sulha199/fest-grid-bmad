scalar JSON

enum InstagramEmbedStatus {
  AVAILABLE
  UNAVAILABLE
}

type InstagramEmbed {
  status: InstagramEmbedStatus!
  html: String
  durableImageUrl: String
}

enum InstagramEmbedBySlugStatus {
  AVAILABLE
  UNAVAILABLE
  NOT_RESOLVABLE_FROM_SLUG
}

type InstagramEmbedBySlug {
  status: InstagramEmbedBySlugStatus!
  html: String
  durableImageUrl: String
}

enum EventType {
  EXHIBITION
  COMPETITION
  FESTIVAL
  PERFORMANCE
  WORKSHOP
  SEMINAR
  MARKET
  GATHERING
  PROMOTION
  FUNDRAISER
  CIVIC
  OTHER
}

enum EventCategory {
  MUSIC
  ARTS_AND_CULTURE
  FOOD_AND_DRINK
  SPORTS_AND_FITNESS
  FAMILY_AND_KIDS
  HOBBIES_AND_INTERESTS
  BUSINESS_AND_NETWORKING
  HEALTH_AND_WELLNESS
  HOLIDAY
  CHARITY_AND_CAUSES
  CIVIC_AND_COMMUNITY
  RELIGION_AND_SPIRITUALITY # Worship services, retreats, interfaith gatherings
  TECHNOLOGY # Tech product promos, hackathons, tech meetups/conferences
  TRAVEL_AND_TOURISM # Travel gear promos, travel fairs, tourism expos
  EDUCATION # Academic olympiads/competitions, school contests
  CAREER # Job fairs, career workshops
  AUTOMOTIVE # Car and motorcycle fairs, exhibitions
  OTHER

# Story 3.7c AC1: do not add sourceSocialMediaAccountProfile/profileImageUrl here — see queries.graphql.test.ts.
query getEvents($limit: Int, $offset: Int, $query: EventQueryConditionInput) {
  events(limit: $limit, offset: $offset, query: $query) {
    items {
      id
      eventName
      slug
      isFavorited
      favoriteCount
      imageUrl
      durableImageUrl
      durableThumbnailUrl
      location
      types
      categories
      schedules {
        id
        isMainSchedule
        eventStartDate
        eventStartTime
        eventEndDate
        eventEndTime
        ticketPrice
        applicableDaysOfWeek
        locationDetails {
          coordinates {
            lat
            lng
          }
        }
      }
    }
    hasMore
    totalCount
  }
}

query getFavoritedEventIds($query: EventQueryConditionInput) {
  events(query: $query) {
    items {
      id
    }
    totalCount
  }
}

query getEventBySlug($slug: String!) {
  eventBySlug(slug: $slug) {
    id
    eventName
    slug
    description
    location
    types
    categories
    imageUrl
    durableImageUrl
    durableThumbnailUrl
    videoUrl
    sourcePostUrl
    originalPostUrl
    publishedAt
    organizerName
    contactInfo
    hasPrivateContact
    links {
      url
      label
    }
    isFavorited
    favoriteCount
    isHiddenForCurrentUser
    sourceSocialMediaAccountProfile {
      accountId
      platform
      username
      displayName
      profileImageUrl
      accountType
      defaultLocation {
        coordinates {
          lat
          lng
        }
        placeName
        formattedAddress
        confidence
        matchType
      }
    }
    coauthors {
      accountId
      platform
      username
      displayName
      profileImageUrl
    }
    sourcePosts {
      postId
      isPrimary
      groupingReason
      extractedEventCount
      title
      postedAt
      sourcePostUrl
      originalPostUrl
      platformPostId
      postType
      account {
        accountId
        platform
        username
        displayName
        profileImageUrl
      }
      coauthors {
        accountId
        platform
        username
        displayName
        profileImageUrl
      }
    }
    schedules {
      id
      isMainSchedule
      title
      eventStartDate
      isAddedToCalendar
      eventEndDate
      eventStartTime
      eventEndTime
      timezone
      timezoneStatus
      performers
      location
      locationDetails {
        coordinates {
          lat
          lng
        }
        placeName
        placeId
        formattedAddress
        timezone
        confidence
        matchType
      }
      ticketPrice
      ticketUrl
      registrationUrl
      applicableDaysOfWeek
    }
  }
}

query getRelatedEventIds($eventId: ID!) {
  relatedEventIds(eventId: $eventId) {
    postId
    eventIds
  }
}

# Story 3.6x (AC4) -- the post-keyed sibling of getRelatedEventIds above, for the Post Collection
# Page's own content fetch. getRelatedEventIds (above) is left untouched -- a separate document,
# not a reused one with an optional variable, mirrors AD-30 Rule 11's eventId|postId split.
query getRelatedEventIdsByPost($postId: ID!) {
  relatedEventIds(postId: $postId) {
    postId
    eventIds
  }
}

# Story 3.6x (AC1, AC3) -- backend-only lookup resolving the Post Collection Page route's three
# platform-identifier URL segments into a real postId, for generateMetadata and the page's own
# fetch. Selects only what the route/PageHeader needs -- not EventSourcePost's event-detail-only
# fields (isPrimary/coauthors/sourcePostUrl/originalPostUrl), confined per the project's existing
# list-view selection-confinement convention.
query getPostByPlatformIdentifiers($platform: String!, $postType: String!, $platformPostId: String!) {
  postByPlatformIdentifiers(platform: $platform, postType: $postType, platformPostId: $platformPostId) {
    postId
    account {
      accountId
      platform
      username
      displayName
      profileImageUrl
    }
    groupingReason
    extractedEventCount
  }
}

query getInstagramEmbedBySlug($slug: String!) {
  instagramEmbedBySlug(slug: $slug) {
    status
    html
    durableImageUrl
  }
}

query getInstagramEmbedForEvent($eventId: ID!) {
  event(id: $eventId) {
    instagramEmbed {
      status
      html
      durableImageUrl
    }
  }
}

query getEventForIcsExport($id: ID!) {
  event(id: $id) {
    id
    eventName
    slug
    description
    location
    schedules {
      id
      eventStartDate
      eventEndDate
      eventStartTime
      eventEndTime
      timezone
      location
      locationDetails {
        formattedAddress
      }
    }
  }
}


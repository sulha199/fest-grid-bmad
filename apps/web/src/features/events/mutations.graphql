mutation toggleFavorite($eventId: ID!) {
  toggleFavorite(eventId: $eventId) {
    eventId
    isFavorited
  }
}

mutation toggleCalendarAddition($eventId: ID!, $scheduleId: ID!) {
  toggleCalendarAddition(eventId: $eventId, scheduleId: $scheduleId) {
    eventId
    scheduleId
    isAddedToCalendar
  }
}

mutation resolveScheduleTimezone($scheduleId: ID!, $timezone: String!) {
  resolveScheduleTimezone(scheduleId: $scheduleId, timezone: $timezone) {
    scheduleId
    timezone
    timezoneStatus
  }
}

mutation resolvePromptToEventFilter($prompt: String!) {
  resolvePromptToEventFilter(prompt: $prompt) {
    resolvedFilter {
      accountId
      types
      categories
      keyword
      dateRange {
        anchor
        offsetAmount
        offsetUnit
      }
      dayOfWeek
      location {
        coordinates {
          lat
          lng
        }
        radiusMeters
        adminArea
      }
      venueType
      isFree
    }
    caveats
  }
}


mutation saveAIEventFilter($prompt: String!, $resolvedFilter: EventFilterInput!) {
  saveAIEventFilter(prompt: $prompt, resolvedFilter: $resolvedFilter) {
    id
    ownerUserId
    prompt
    resolvedFilter {
      accountId
      types
      categories
      keyword
      dateRange {
        anchor
        offsetAmount
        offsetUnit
      }
      dayOfWeek
      location {
        coordinates {
          lat
          lng
        }
        radiusMeters
        adminArea
      }
      venueType
      isFree
    }
    createdAt
    updatedAt
    deletedAt
  }
}

mutation deleteAIEventFilter($id: ID!, $action: SoftDeleteAction!) {
  deleteAIEventFilter(id: $id, action: $action) {
    id
    deletedAt
  }
}


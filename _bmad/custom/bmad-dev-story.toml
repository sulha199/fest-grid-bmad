[workflow]
persistent_facts = [
  "file:{project-root}/_bmad-output/planning-artifacts/story-content-structure.md",
  "Treat story-content-structure.md as the implementation contract for upcoming stories.",
  "When a story is materially non-compliant with the canonical structure, pause and instruct running bmad-create-story validate before continuing implementation.",
  "Before coding, verify the story contains Pre-Coding Approval Gate and that approval to start coding is explicitly granted; if not granted, pause and ask for approval.",
  "If the story's Dev Notes contain an 'Architecture & UX Gate Findings' entry referencing a prerequisite story, check that prerequisite's status in sprint-status.yaml before implementing. If it is not done, pause and ask the user whether to implement the prerequisite first or proceed with the accepted gap.",
  "When implementing a story, enforce strict package dependency rules: State management (react-query, nuqs, zustand) must be installed strictly within apps/web. Testing frameworks (vitest, msw) should use the shared config package (@festgrid/testing-config) if it exists, but playwright must stay in apps/web. Schema validation must be strictly isolated: zod only in apps/web (or specific UI packages) and ajv only in apps/backend. Firebase must be split: firebase-admin strictly in apps/backend and firebase JS SDK strictly in apps/web. Do not mix these distinct domain tools in a single shared package."
]

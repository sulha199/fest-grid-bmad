type UserLocation {
  id: ID!
  name: String!
  locationDetails: LocationDetails!
  radius: Int!
  createdAt: String!
  updatedAt: String!
}

type AddressSuggestion {
  placeId: String!
  description: String!
}

input CreateUserLocationInput {
  name: String!
  address: String
  latitude: Float
  longitude: Float
  placeId: String
  radius: Int!
}

input UpdateUserLocationInput {
  name: String
  address: String
  latitude: Float
  longitude: Float
  placeId: String
  radius: Int
}

extend type Query {
  myLocations: [UserLocation!]!
  addressAutocomplete(input: String!): [AddressSuggestion!]!
}

extend type Mutation {
  createUserLocation(input: CreateUserLocationInput!): UserLocation!
  updateUserLocation(id: ID!, input: UpdateUserLocationInput!): UserLocation!
  deleteUserLocation(id: ID!): Boolean!
}

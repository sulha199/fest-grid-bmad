query getMySubscriptions {
  mySubscriptions {
    id
    accountId
    isNewlyAdded
    isInactive
    activityState
    latestPostAt
    createdAt
    pendingExtractionCount
    account {
      id
      accountId
      platform
      displayName
      username
      profileImageUrl
      isScrapeInProgress
      lastScrapedAt
      accountType
      accountTypeStatus
      defaultLocation {
        coordinates {
          lat
          lng
        }
        formattedAddress
        placeName
      }
      hasPendingDefaultLocationReview
    }
  }
}

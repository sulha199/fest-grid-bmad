query getArchivedEvents($limit: Int, $offset: Int) {
  events(limit: $limit, offset: $offset, includeMyArchived: true) {
    items {
      id
      slug
      eventName
      imageUrl
      location
      categories
      types
      schedules {
        isMainSchedule
        eventStartDate
        ticketPrice
      }
      deletedAt
      isHiddenForCurrentUser
      isExpiredForCurrentUser
    }
    hasMore
    totalCount
  }
}

query getMyAIEventFilters {
  myAIEventFilters {
    id
    ownerUserId
    prompt
    resolvedFilter {
      accountId
      types
      categories
      keyword
      dateRange {
        anchor
        offsetAmount
        offsetUnit
      }
      dayOfWeek
      location {
        coordinates {
          lat
          lng
        }
        radiusMeters
        adminArea
      }
      venueType
      isFree
    }
    createdAt
    updatedAt
    deletedAt
  }
}


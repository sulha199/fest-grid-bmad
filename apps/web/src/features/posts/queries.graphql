query getPostsByAccount($accountId: ID!, $cursor: String, $limit: Int, $onlyUnextracted: Boolean) {
  postsByAccount(accountId: $accountId, cursor: $cursor, limit: $limit, onlyUnextracted: $onlyUnextracted) {
    items {
      id
      accountId
      content
      imageUrl
      postUrl
      originalPostUrl
      isExtracted
      publishedAt
    }
    nextCursor
    hasMore
  }
}

query getMyExtractionQuota {
  myExtractionQuota {
    limit
    used
    remaining
  }
}

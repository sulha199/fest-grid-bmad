name: CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      backfill_s3_key:
        description: >-
          S3 object key (inside the OpsBackfillBucket-prod bucket) of the backfill input
          JSON. Upload the file first with:
          aws s3 cp ./runs.json s3://<OpsBackfillBucket-prod bucket name>/<key>
          (bucket name is the CDK stack's opsBackfillBucketName output). See
          docs/infrastructure/incidents/2026-09-05-scraper-audit-trail-gap.md for the
          exact JSON shape and full runbook.
        required: true
        type: string
      apply:
        description: 'Commit changes (unchecked = dry run, writes nothing)'
        required: true
        type: boolean
        default: false
      window_hours:
        description: 'Fuzzy-match time window (+/- hours) for relinking posts/unprocessed_scraper_payloads'
        required: false
        type: number
        default: 2

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: festgrid
          POSTGRES_PASSWORD: festgrid
          POSTGRES_DB: festgrid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://festgrid:festgrid@localhost:5432/festgrid_test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      - name: Run build
        run: pnpm run build

      - name: Run Database Migrations (test DB)
        run: pnpm --filter @festgrid/database run migrate

      - name: Seed test DB
        run: pnpm --filter @festgrid/database run seed

      - name: Run tests
        env:
          BACKEND_PORT: '4001'
          GEOAPIFY_API_KEY: 'test-geoapify-key'
        run: pnpm run test

  db-migrate:
    name: Database Migrations
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    concurrency:
      group: db-migrate
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Database Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd packages/database
          pnpm run migrate

  deploy-infrastructure:
    name: Deploy Infrastructure to AWS
    needs: [ci, db-migrate]
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    concurrency:
      group: deploy-infrastructure
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy CDK Stack (Prod)
        env:
          DEPLOY_STAGE: prod
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ vars.FIREBASE_CLIENT_EMAIL }}
          SES_FROM_EMAIL_ADDRESS: ${{ vars.SES_FROM_EMAIL_ADDRESS }}
          SYSTEM_ERROR_ALERT_EMAIL: ${{ vars.SYSTEM_ERROR_ALERT_EMAIL }}
          WEB_APP_BASE_URL: ${{ vars.WEB_APP_BASE_URL }}
        run: pnpm --filter infrastructure exec cdk deploy FestgridBackendStack-prod --require-approval never

  # Manual-only (workflow_dispatch), never runs on push/pull_request. Runbook:
  # docs/infrastructure/incidents/2026-09-05-scraper-audit-trail-gap.md#backfilling-already-orphaned-rows
  #
  # The backfill input JSON is NOT passed as a workflow input (GitHub Actions caps inputs
  # well below the size these files reach, and it must never be committed to the repo or
  # exposed in logs/URLs). Instead it's uploaded ahead of time to the private
  # OpsBackfillBucket-prod S3 bucket (CDK: apps/infrastructure/lib/festgrid-backend-stack.ts,
  # output "opsBackfillBucketName") — public access is fully blocked on that bucket and
  # objects auto-expire after 7 days. This job downloads it with the same AWS credentials
  # already used by deploy-infrastructure above, runs it, then deletes the S3 object itself
  # (belt-and-suspenders alongside the bucket's own expiration).
  backfill-scraper-audit-trail:
    name: Backfill Scraper Audit Trail (manual)
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: backfill-scraper-audit-trail
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Resolve Ops Backfill Bucket name
        id: bucket
        run: |
          NAME=$(aws cloudformation describe-stacks \
            --stack-name FestgridBackendStack-prod \
            --query "Stacks[0].Outputs[?OutputKey=='opsBackfillBucketName'].OutputValue" \
            --output text)
          if [ -z "$NAME" ] || [ "$NAME" = "None" ]; then
            echo "::error::Could not resolve opsBackfillBucketName from FestgridBackendStack-prod outputs."
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Download backfill input from S3
        run: |
          aws s3 cp "s3://${{ steps.bucket.outputs.name }}/${{ inputs.backfill_s3_key }}" ./backfill-input.json

      - name: Skip if input file is empty
        id: check-file
        run: |
          SIZE=$(stat -c%s ./backfill-input.json 2>/dev/null || stat -f%z ./backfill-input.json)
          if [ "$SIZE" -eq 0 ]; then
            echo "::warning::backfill-input.json is empty (0 bytes) — skipping run, nothing to backfill."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$(cat ./backfill-input.json | tr -d '[:space:]')" = "[]" ]; then
            echo "::warning::backfill-input.json is an empty JSON array — skipping run, nothing to backfill."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run backfill
        if: steps.check-file.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd packages/database
          ARGS="backfill --input ../../backfill-input.json --window-hours ${{ inputs.window_hours }}"
          if [ "${{ inputs.apply }}" = "true" ]; then
            ARGS="$ARGS --apply"
          else
            echo "::notice::Running in DRY RUN mode — nothing will be written. Re-run with 'apply: true' to commit."
          fi
          npx tsx backfill-scraper-actor-runs.ts $ARGS

      - name: Delete backfill input from S3
        if: always()
        run: |
          aws s3 rm "s3://${{ steps.bucket.outputs.name }}/${{ inputs.backfill_s3_key }}" || true

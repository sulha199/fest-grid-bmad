mutation submitCorrection($eventId: ID!, $proposedData: ProposedEventCorrectionInput!, $source: CorrectionSource!, $guardianPermissionConfirmed: Boolean) {
  submitCorrection(eventId: $eventId, proposedData: $proposedData, source: $source, guardianPermissionConfirmed: $guardianPermissionConfirmed) {
    id
    status
    guardianPermissionConfirmed
    validationErrors {
      field
      message
    }
  }
}

mutation extractEventDataFromUrl($url: String!) {
  extractEventDataFromUrl(url: $url) {
    jobId
    data {
      eventName
      types
      categories
      location
      organizerName
      contactInfo
      description
      schedules {
        isMainSchedule
        eventStartDate
        eventEndDate
        eventStartTime
        eventEndTime
        title
        performers
        location
        ticketPrice
      }
    }
    errorCode
    errorMessage
  }
}

query extractionJob($id: ID!) {
  extractionJob(id: $id) {
    status
    data {
      eventName
      types
      categories
      location
      organizerName
      contactInfo
      description
      schedules {
        isMainSchedule
        eventStartDate
        eventEndDate
        eventStartTime
        eventEndTime
        title
        performers
        location
        ticketPrice
      }
    }
    errorCode
    errorMessage
  }
}
